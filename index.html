<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài Liệu Ôn Tập & Ngân Hàng Đề Thi - Toán 9</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    .bg-grid-paper {
      background-color: #1e3a8a;
      background-image: linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 25px 25px;
    }
    .bg-white-grid {
      background-color: #ffffff;
      background-image: linear-gradient(rgba(0, 0, 0, 0.08) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 0, 0, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <div id="app"></div>

  <!-- BỘ CÔNG CỤ NỔI BÊN GÓC PHẢI -->
  <div class="fixed bottom-5 right-5 z-50 flex flex-col items-end gap-3">
    
    <!-- MODAL BẢNG VIẾT SCRBLE INK -->
    <div id="scrbleBoardWidget" class="hidden bg-white rounded-2xl shadow-2xl w-[90vw] md:w-[800px] h-[550px] border flex flex-col overflow-hidden">
      <div class="bg-indigo-700 text-white p-3 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-pen-nib"></i>
          <span class="font-bold text-sm">Bảng Viết Dạy Học Online (Scrble Ink)</span>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <button onclick="setBoardBg('grid')" class="bg-indigo-800 px-2 py-1 rounded hover:bg-indigo-900">Bảng xanh ô li</button>
          <button onclick="setBoardBg('white')" class="bg-indigo-800 px-2 py-1 rounded hover:bg-indigo-900">Giấy trắng</button>
          <button onclick="clearBoardCanvas()" class="bg-red-600 px-2 py-1 rounded hover:bg-red-700"><i class="fa-solid fa-trash"></i> Xóa bảng</button>
          <button onclick="toggleWidget('scrbleBoardWidget')" class="text-white hover:text-gray-200 ml-2"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
      </div>
      <div class="bg-gray-100 p-2 border-b flex items-center gap-3 text-xs shrink-0">
        <span class="font-bold">Màu bút:</span>
        <button onclick="setPenColor('#ffffff')" class="w-5 h-5 rounded-full bg-white border border-gray-400"></button>
        <button onclick="setPenColor('#facc15')" class="w-5 h-5 rounded-full bg-yellow-400"></button>
        <button onclick="setPenColor('#ef4444')" class="w-5 h-5 rounded-full bg-red-500"></button>
        <button onclick="setPenColor('#3b82f6')" class="w-5 h-5 rounded-full bg-blue-500"></button>
        <span class="font-bold ml-2">Nét bút:</span>
        <input type="range" id="penSize" min="1" max="10" value="3" class="w-20" onchange="setPenWidth(this.value)">
      </div>
      <div class="flex-1 relative overflow-hidden bg-grid-paper" id="boardContainer">
        <canvas id="inkCanvas" class="w-full h-full cursor-crosshair"></canvas>
      </div>
    </div>

    <!-- MODAL MÁY TÍNH CASIO FX-580VN X -->
    <div id="casioWidget" class="hidden bg-slate-800 text-white rounded-2xl shadow-2xl w-72 p-4 border border-slate-600 flex flex-col space-y-3">
      <div class="flex justify-between items-center border-b border-slate-600 pb-2">
        <span class="font-bold text-xs text-yellow-400">CASIO fx-580VN X</span>
        <button onclick="toggleWidget('casioWidget')" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="bg-emerald-950 text-emerald-300 font-mono text-right p-3 rounded-lg text-lg border border-emerald-700 min-h-[50px] break-all" id="casioScreen">0</div>
      <div class="grid grid-cols-4 gap-1.5 text-xs font-bold">
        <button onclick="pressCasio('C')" class="bg-red-600 p-2 rounded">AC</button>
        <button onclick="pressCasio('(')" class="bg-slate-700 p-2 rounded">(</button>
        <button onclick="pressCasio(')')" class="bg-slate-700 p-2 rounded">)</button>
        <button onclick="pressCasio('/')" class="bg-amber-600 p-2 rounded">÷</button>
        
        <button onclick="pressCasio('7')" class="bg-slate-600 p-2 rounded">7</button>
        <button onclick="pressCasio('8')" class="bg-slate-600 p-2 rounded">8</button>
        <button onclick="pressCasio('9')" class="bg-slate-600 p-2 rounded">9</button>
        <button onclick="pressCasio('*')" class="bg-amber-600 p-2 rounded">×</button>
        
        <button onclick="pressCasio('4')" class="bg-slate-600 p-2 rounded">4</button>
        <button onclick="pressCasio('5')" class="bg-slate-600 p-2 rounded">5</button>
        <button onclick="pressCasio('6')" class="bg-slate-600 p-2 rounded">6</button>
        <button onclick="pressCasio('-')" class="bg-amber-600 p-2 rounded">-</button>
        
        <button onclick="pressCasio('1')" class="bg-slate-600 p-2 rounded">1</button>
        <button onclick="pressCasio('2')" class="bg-slate-600 p-2 rounded">2</button>
        <button onclick="pressCasio('3')" class="bg-slate-600 p-2 rounded">3</button>
        <button onclick="pressCasio('+')" class="bg-amber-600 p-2 rounded">+</button>
        
        <button onclick="pressCasio('0')" class="bg-slate-600 p-2 rounded col-span-2">0</button>
        <button onclick="pressCasio('.')" class="bg-slate-600 p-2 rounded">.</button>
        <button onclick="pressCasio('=')" class="bg-blue-600 p-2 rounded">=</button>
      </div>
    </div>

    <!-- MODAL VẼ ĐỒ THỊ AI -->
    <div id="graphWidget" class="hidden bg-white rounded-2xl shadow-2xl w-[90vw] md:w-[700px] h-[500px] border flex flex-col overflow-hidden">
      <div class="bg-teal-700 text-white p-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-chart-line"></i>
          <span class="font-bold text-sm">Công Cụ AI Vẽ Đồ Thị Hàm Số Tương Tác</span>
        </div>
        <button onclick="toggleWidget('graphWidget')" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="flex-1 w-full h-full">
        <iframe src="https://www.desmos.com/calculator?embed" class="w-full h-full border-none"></iframe>
      </div>
    </div>

    <!-- MODAL CHATBOT TRỢ GIẢNG AI -->
    <div id="aiChatWidget" class="hidden bg-white rounded-2xl shadow-2xl w-80 md:w-96 border flex flex-col overflow-hidden h-[450px]">
      <div class="bg-blue-600 text-white p-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-robot text-lg"></i>
          <span class="font-bold text-sm">Trợ Giảng AI - Toán 9</span>
        </div>
        <button onclick="toggleWidget('aiChatWidget')" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="aiChatMessages" class="flex-1 p-3 overflow-y-auto space-y-3 text-xs bg-gray-50">
        <div class="bg-blue-50 text-blue-900 p-2.5 rounded-xl border border-blue-100 max-w-[85%]">
          Xin chào! Mình là trợ giảng AI. Bạn có thắc mắc gì về bài tập hoặc lý thuyết cần hỗ trợ không?
        </div>
      </div>
      <div class="p-2.5 bg-white border-t flex gap-2">
        <input type="text" id="aiChatInput" placeholder="Nhập câu hỏi toán..." class="flex-1 p-2 border rounded-xl text-xs outline-none focus:ring-1 focus:ring-blue-500" onkeydown="if(event.key==='Enter') sendAIMessage()">
        <button onclick="sendAIMessage()" class="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-semibold hover:bg-blue-700"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>

    <!-- THANH NÚT BẤM CÔNG CỤ NỔI -->
    <div class="flex gap-2">
      <button onclick="toggleWidget('scrbleBoardWidget'); initBoardCanvas();" class="bg-indigo-600 text-white px-3 py-3 rounded-full shadow-2xl flex items-center gap-1.5 hover:bg-indigo-700 text-xs font-bold transition transform hover:scale-105" title="Bảng viết Scrble Ink">
        <i class="fa-solid fa-pen-nib text-base"></i> <span class="hidden md:inline">Bảng viết Ink</span>
      </button>
      <button onclick="toggleWidget('casioWidget')" class="bg-slate-700 text-yellow-400 px-3 py-3 rounded-full shadow-2xl flex items-center gap-1.5 hover:bg-slate-800 text-xs font-bold transition transform hover:scale-105" title="Máy tính Casio FX-580">
        <i class="fa-solid fa-calculator text-base"></i> <span class="hidden md:inline">Casio 580</span>
      </button>
      <button onclick="toggleWidget('graphWidget')" class="bg-teal-600 text-white px-3 py-3 rounded-full shadow-2xl flex items-center gap-1.5 hover:bg-teal-700 text-xs font-bold transition transform hover:scale-105" title="Vẽ đồ thị hàm số">
        <i class="fa-solid fa-chart-line text-base"></i> <span class="hidden md:inline">Vẽ Đồ Thị</span>
      </button>
      <button onclick="toggleWidget('aiChatWidget')" class="bg-blue-600 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center hover:bg-blue-700 transition transform hover:scale-105" title="Trợ giảng AI">
        <i class="fa-solid fa-comments text-xl"></i>
      </button>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD73a7Wr2d2_u4FeSfigcZ2pfrL6ai-3iQ",
      authDomain: "webtoan9.firebaseapp.com",
      databaseURL: "https://webtoan9-default-rtdb.firebaseio.com",
      projectId: "webtoan9",
      storageBucket: "webtoan9.firebasestorage.app",
      messagingSenderId: "688386595335",
      appId: "1:688386595335:web:c77441d012b1dba56be8a2",
      measurementId: "G-NH4MZXP235"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myAppState = {
      currentUser: null,
      view: 'home',
      selectedSubject: 'Toán 9',
      roadmaps: [],
      lectures: [],
      exams: [],
      questions: [],
      students: [],
      submissions: [],
      activeExam: null,
      userAnswers: { mcq: {}, tf: {}, sa: {} },
      timeRemaining: 0,
      resultObj: null,
      timerRef: null,
      tetTimerInterval: null,
      openRoadmaps: {},
      openChapters: {}
    };

    function bootApp() {
      db.ref('roadmaps').on('value', snap => {
        const d = snap.val();
        myAppState.roadmaps = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('lectures').on('value', snap => {
        const d = snap.val();
        myAppState.lectures = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('exams').on('value', snap => {
        const d = snap.val();
        myAppState.exams = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('questions').on('value', snap => {
        const d = snap.val();
        myAppState.questions = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('students').on('value', snap => {
        const d = snap.val();
        myAppState.students = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('submissions').on('value', snap => {
        const d = snap.val();
        myAppState.submissions = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })).reverse() : [];
        renderUI();
      });
    }

    const studyWishes = [
      "Học, học nữa, học mãi! Thành công luôn đến với những ai kiên trì ôn luyện mỗi ngày.",
      "Kiến thức là sức mạnh. Chúc bạn hôm nay tiếp thu thật nhiều điều mới mẻ và bổ ích!",
      "Mỗi bài toán giải được là một bước tiến gần hơn đến ước mơ và cánh cửa trường chuyên lớp chọn!"
    ];

    function getDailyStudyWish() {
      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
      return studyWishes[dayOfYear % studyWishes.length];
    }

    function exportQuestionBank() {
      if (myAppState.questions.length === 0) {
        alert('Ngân hàng câu hỏi trống!');
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myAppState.questions, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "NganHangCauHoi_Toan9.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // MÁY TÍNH CASIO 580
    let casioExpr = '';
    function pressCasio(val) {
      const screen = document.getElementById('casioScreen');
      if (val === 'C') {
        casioExpr = '';
        screen.innerText = '0';
      } else if (val === '=') {
        try {
          let res = eval(casioExpr.replace(/×/g, '*').replace(/÷/g, '/'));
          screen.innerText = res;
          casioExpr = res.toString();
        } catch(e) {
          screen.innerText = 'Syntax ERROR';
          casioExpr = '';
        }
      } else {
        casioExpr += val;
        screen.innerText = casioExpr;
      }
    }

    // BẢNG VIẾT SCRBLE INK
    let isDrawing = false;
    let penColor = '#ffffff';
    let penWidth = 3;
    let canvas, ctx;

    function initBoardCanvas() {
      setTimeout(() => {
        canvas = document.getElementById('inkCanvas');
        if (!canvas) return;
        const container = document.getElementById('boardContainer');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        ctx = canvas.getContext('2d');
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        canvas.onmousedown = startDraw;
        canvas.onmousemove = draw;
        canvas.onmouseup = stopDraw;
        canvas.ontouchstart = (e) => { startDraw(e.touches[0]); };
        canvas.ontouchmove = (e) => { draw(e.touches[0]); };
        canvas.ontouchend = stopDraw;
      }, 100);
    }

    function startDraw(e) {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.strokeStyle = penColor;
      ctx.lineWidth = penWidth;
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    }

    function stopDraw() { isDrawing = false; }
    function setPenColor(c) { penColor = c; }
    function setPenWidth(w) { penWidth = w; }
    function clearBoardCanvas() { if(ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height); }
    function setBoardBg(type) {
      const container = document.getElementById('boardContainer');
      if (type === 'grid') {
        container.className = "flex-1 relative overflow-hidden bg-grid-paper";
        penColor = '#ffffff';
      } else {
        container.className = "flex-1 relative overflow-hidden bg-white-grid";
        penColor = '#000000';
      }
    }

    function toggleWidget(id) {
      const el = document.getElementById(id);
      if (el.classList.contains('hidden')) el.classList.remove('hidden');
      else el.classList.add('hidden');
    }

    function toggleRoadmap(id) {
      myAppState.openRoadmaps[id] = !myAppState.openRoadmaps[id];
      renderUI();
    }

    function toggleChapterCollapse(chapId) {
      myAppState.openChapters[chapId] = !myAppState.openChapters[chapId];
      renderUI();
    }

    function deleteLecture(id) {
      if (confirm('Thầy/cô có chắc chắn muốn xóa bài giảng này không?')) {
        db.ref('lectures/' + id).remove(err => {
          if (!err) alert('Đã xóa bài giảng thành công!');
        });
      }
    }

    function deleteRoadmap(id) {
      if (confirm('Xóa lộ trình này sẽ làm mất các chương bên trong. Thầy/cô chắc chứ?')) {
        db.ref('roadmaps/' + id).remove();
      }
    }

    function deleteChapter(roadmapId, chapIdx) {
      const rm = myAppState.roadmaps.find(r => r.id === roadmapId);
      if (rm && rm.chapters) {
        rm.chapters.splice(chapIdx, 1);
        db.ref('roadmaps/' + roadmapId).update({ chapters: rm.chapters });
      }
    }

    function renderUI() {
      const rootDiv = document.getElementById('app');
      
      if (!myAppState.currentUser) {
        rootDiv.innerHTML = `
          <div class="min-h-screen bg-blue-600 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8">
              <h1 class="text-2xl font-bold text-center mb-1 text-gray-800">Tài Liệu Ôn Tập THCS & THPT</h1>
              <p class="text-center text-sm text-gray-500 mb-6">Hệ thống thi online & Ngân hàng câu hỏi</p>
              <form id="loginForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold mb-1">Tên đăng nhập</label>
                  <input type="text" id="username" required class="w-full p-3 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Mật khẩu</label>
                  <input type="password" id="password" required class="w-full p-3 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700">Đăng Nhập</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('loginForm').onsubmit = (e) => {
          e.preventDefault();
          const u = document.getElementById('username').value;
          const p = document.getElementById('password').value;
          if (u === 'admin' && p === 'admin123') {
            myAppState.currentUser = { username: 'Admin', role: 'admin' };
          } else {
            const found = myAppState.students.find(s => s.username === u && s.password === p);
            if (found) myAppState.currentUser = { username: found.username, role: 'student' };
            else alert('Tài khoản hoặc mật khẩu không chính xác!');
          }
          renderUI();
        };
        return;
      }

      let navButtons = `
        <button onclick="navTo('home')" class="hover:underline font-semibold">Thư mục</button>
        <button onclick="navTo('exam_list')" class="hover:underline font-semibold">Kiểm tra</button>
        <button onclick="navTo('question_bank')" class="hover:underline font-semibold">Ngân hàng câu hỏi</button>
      `;
      if (myAppState.currentUser.role === 'admin') {
        navButtons += `
          <button onclick="navTo('statistics')" class="hover:underline font-semibold">Thống kê</button>
          <button onclick="navTo('admin_panel')" class="hover:underline font-semibold">Quản lý HS</button>
        `;
      }

      let mainArea = '';

      if (myAppState.view === 'home') {
        const subjects = ['Toán 9', 'Toán 8', 'Toán 7', 'Đại số 10', 'Hình học 11', 'Ôn thi vào 10'];

        mainArea = `
          <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <div class="flex gap-2 overflow-x-auto pb-2">
              ${subjects.map(s => `<button onclick="pickSubject('${s}')" class="px-3 py-1.5 rounded text-sm font-medium ${myAppState.selectedSubject === s ? 'bg-blue-600 text-white' : 'bg-white border'}">${s}</button>`).join('')}
            </div>
            <div class="flex gap-2">
              ${myAppState.currentUser.role === 'admin' ? `
                <button onclick="openModal('modalRoadmap')" class="bg-indigo-600 text-white px-3 py-2 rounded text-sm font-semibold hover:bg-indigo-700 shrink-0">+ Thêm Lộ Trình</button>
                <button onclick="openModal('modalChapter')" class="bg-amber-600 text-white px-3 py-2 rounded text-sm font-semibold hover:bg-amber-700 shrink-0">+ Thêm Chương</button>
                <button onclick="openModal('modalLec')" class="bg-green-600 text-white px-3 py-2 rounded text-sm font-semibold hover:bg-green-700 shrink-0">+ Đăng Bài Giảng</button>
              ` : ''}
            </div>
          </div>

          <!-- DANH SÁCH LỘ TRÌNH ĐỘNG TỪ FIREBASE -->
          <div class="space-y-4">
            ${myAppState.roadmaps.length === 0 ? `<div class="bg-white p-6 rounded-xl text-center text-gray-500">Chưa có lộ trình nào. Thầy/cô bấm "+ Thêm Lộ Trình" ở góc trên để tạo mới nhé!</div>` :
              myAppState.roadmaps.map((rm) => {
                const isOpen = myAppState.openRoadmaps[rm.id];
                return `
                  <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-red-200">
                    <div class="w-full bg-red-700 hover:bg-red-800 text-white font-bold p-4 flex justify-between items-center transition">
                      <button onclick="toggleRoadmap('${rm.id}')" class="flex-1 text-left text-sm sm:text-base uppercase tracking-wider flex items-center">
                        <i class="fa-solid fa-layer-group mr-2"></i>${rm.title}
                      </button>
                      <div class="flex items-center gap-2">
                        ${myAppState.currentUser.role === 'admin' ? `
                          <button onclick="deleteRoadmap('${rm.id}')" class="text-red-200 hover:text-white p-1 text-xs" title="Xóa lộ trình">
                            <i class="fa-solid fa-trash-can"></i>
                          </button>
                        ` : ''}
                        <button onclick="toggleRoadmap('${rm.id}')">
                          <i class="fa-solid fa-chevron-${isOpen ? 'up' : 'down'} text-white"></i>
                        </button>
                      </div>
                    </div>

                    ${isOpen ? `
                      <div class="p-3 sm:p-4 space-y-4 bg-gray-50">
                        ${(!rm.chapters || rm.chapters.length === 0) ? `<div class="text-xs text-gray-500 italic p-2">Chưa có chương nào trong lộ trình này.</div>` :
                          rm.chapters.map((chapName, cIdx) => {
                            const chapKey = rm.id + '_' + cIdx;
                            const isChapOpen = myAppState.openChapters[chapKey];
                            const chapLectures = myAppState.lectures.filter(l => l.chapter === chapName);
                            return `
                              <div class="bg-rose-50/80 rounded-xl border border-rose-200 shadow-sm overflow-hidden">
                                <div class="w-full p-3 text-left font-bold text-rose-900 text-sm flex justify-between items-center hover:bg-rose-100 transition">
                                  <button onclick="toggleChapterCollapse('${chapKey}')" class="flex-1 text-left flex items-center">
                                    <i class="fa-solid fa-bookmark mr-2 text-rose-600"></i>${chapName}
                                  </button>
                                  <div class="flex items-center gap-3">
                                    <span class="text-xs bg-rose-200/80 text-rose-800 px-2.5 py-0.5 rounded-full font-semibold">(${chapLectures.length} bài học)</span>
                                    ${myAppState.currentUser.role === 'admin' ? `
                                      <button onclick="deleteChapter('${rm.id}', ${cIdx})" class="text-red-500 hover:text-red-700 text-xs" title="Xóa chương này">
                                        <i class="fa-solid fa-trash-can"></i>
                                      </button>
                                    ` : ''}
                                    <button onclick="toggleChapterCollapse('${chapKey}')">
                                      <i class="fa-solid fa-chevron-${isChapOpen ? 'up' : 'down'} text-rose-700"></i>
                                    </button>
                                  </div>
                                </div>

                                ${isChapOpen ? `
                                  <div class="bg-white border-t border-rose-100 divide-y divide-gray-100">
                                    ${chapLectures.length === 0 ? `<div class="p-4 text-center text-xs text-gray-500 italic">Chưa có bài giảng nào trong chuyên đề này.</div>` : 
                                      chapLectures.map(l => `
                                        <div class="p-3 sm:px-4 sm:py-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 hover:bg-gray-50 transition">
                                          <div class="space-y-1">
                                            <div class="flex items-center gap-2">
                                              <i class="fa-solid fa-book-open text-blue-600 text-sm"></i>
                                              <h4 class="font-bold text-gray-900 text-sm">${l.title}</h4>
                                            </div>
                                            <p class="text-xs text-gray-500">GV: ${l.instructor || 'Hai Ton'} | ${l.date || ''}</p>
                                            ${l.description ? `<p class="text-xs text-gray-600">${l.description}</p>` : ''}
                                          </div>

                                          <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto justify-end">
                                            ${l.fileUrl ? `<a href="${l.fileUrl}" download="${l.fileName || 'TaiLieu'}" class="bg-blue-50 text-blue-700 hover:bg-blue-600 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition" title="Tải tài liệu"><i class="fa-solid fa-file-arrow-down"></i> <span class="hidden md:inline">Tài liệu</span></a>` : ''}
                                            ${l.solutionUrl ? `<a href="${l.solutionUrl}" download="DapAnChiTiet" class="bg-green-50 text-green-700 hover:bg-green-600 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition" title="Tải đáp án"><i class="fa-solid fa-file-lines"></i> <span class="hidden md:inline">Đáp án</span></a>` : ''}
                                            ${l.videoUrl ? `<a href="${l.videoUrl}" target="_blank" class="bg-red-50 text-red-700 hover:bg-red-600 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition" title="Xem video"><i class="fa-solid fa-video"></i> <span class="hidden md:inline">Video</span></a>` : ''}
                                            
                                            ${myAppState.currentUser.role === 'admin' ? `
                                              <button onclick="deleteLecture('${l.id}')" class="bg-red-100 hover:bg-red-600 text-red-700 hover:text-white p-1.5 rounded-lg text-xs font-bold transition ml-1" title="Xóa bài giảng">
                                                <i class="fa-solid fa-trash-can"></i>
                                              </button>
                                            ` : ''}
                                          </div>
                                        </div>
                                      `).join('')}
                                  </div>
                                ` : ''}
                              </div>
                            `;
                          })
                        }
                      </div>
                    ` : ''}
                  </div>
                `;
              })
            }
          </div>
        `;
      }

      else if (myAppState.view === 'exam_list') {
        mainArea = `
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Danh Sách Đề Kiểm Tra Online</h2>
            ${myAppState.currentUser.role === 'admin' ? `<button onclick="openModal('modalExam')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-green-700">+ Tạo Đề Thi Mới</button>` : ''}
          </div>
          ${myAppState.exams.length === 0 ? `<p class="text-gray-500 text-center py-8 bg-white rounded border">Chưa có đề kiểm tra nào.</p>` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${myAppState.exams.map(e => `
                <div class="bg-white p-4 rounded shadow border flex justify-between items-center">
                  <div>
                    <h3 class="font-bold text-blue-700">${e.title}</h3>
                    <p class="text-xs text-gray-500 mt-1">Thời gian: ${e.duration} phút | ${e.mcqCount || 0} TN - ${e.tfCount || 0} Đ/S - ${e.saCount || 0} Ngắn</p>
                    <div class="flex flex-wrap gap-3 mt-2 text-xs">
                      ${e.fileUrl ? `<a href="${e.fileUrl}" download="DeThi" class="text-blue-600 hover:underline font-semibold"><i class="fa-solid fa-file-pdf mr-1"></i>Tải đề thi</a>` : ''}
                      ${e.solutionUrl ? `<a href="${e.solutionUrl}" download="DapAnChiTiet" class="text-green-600 hover:underline font-semibold"><i class="fa-solid fa-file-lines mr-1"></i>Tải đáp án chi tiết</a>` : ''}
                      ${e.videoUrl ? `<a href="${e.videoUrl}" target="_blank" class="text-red-600 hover:underline font-semibold"><i class="fa-solid fa-video mr-1"></i>Xem video bài giảng</a>` : ''}
                    </div>
                  </div>
                  <button onclick="launchExam('${e.id}')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-blue-700 shrink-0"><i class="fa-solid fa-pen-to-square mr-1"></i> Làm bài</button>
                </div>
              `).join('')}
            </div>
          `}
        `;
      }

      else if (myAppState.view === 'question_bank') {
        mainArea = `
          <div class="bg-white p-6 rounded-xl shadow space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
              <div>
                <h2 class="text-xl font-bold text-blue-800"><i class="fa-solid fa-database mr-2"></i>Ngân Hàng Câu Hỏi Số Hóa</h2>
                <p class="text-xs text-gray-500 mt-0.5">Quản lý và xuất dữ liệu câu hỏi ôn tập</p>
              </div>
              <div class="flex gap-2">
                <button onclick="exportQuestionBank()" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-indigo-700"><i class="fa-solid fa-file-export mr-1.5"></i> Xuất File Ngân Hàng (.json)</button>
                ${myAppState.currentUser.role === 'admin' ? `<button onclick="openModal('modalQuestion')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-green-700">+ Thêm Câu Hỏi</button>` : ''}
              </div>
            </div>

            ${myAppState.questions.length === 0 ? `<p class="text-center text-gray-500 py-10">Ngân hàng câu hỏi chưa có dữ liệu.</p>` : `
              <div class="space-y-3">
                ${myAppState.questions.map((q, idx) => `
                  <div class="p-4 border rounded-xl bg-gray-50 flex justify-between items-start text-xs">
                    <div class="space-y-1">
                      <div class="flex items-center gap-2">
                        <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">Câu ${idx+1}</span>
                        <span class="text-gray-500 font-medium">${q.chapter || 'Chung'}</span>
                        <span class="text-indigo-600 font-semibold">[${q.type || 'TN'}]</span>
                      </div>
                      <p class="font-bold text-gray-800 text-sm mt-1">${q.content}</p>
                      <p class="text-green-700 font-semibold">Đáp án: ${q.correct}</p>
                    </div>
                    ${myAppState.currentUser.role === 'admin' ? `<button onclick="deleteQuestion('${q.id}')" class="text-red-600 hover:text-red-800 font-bold"><i class="fa-solid fa-trash"></i></button>` : ''}
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      }

      let allChaptersList = [];
      myAppState.roadmaps.forEach(r => {
        if (r.chapters) allChaptersList.push(...r.chapters);
      });

      rootDiv.innerHTML = `
        <div class="min-h-screen flex flex-col">
          <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow sticky top-0 z-40">
            <div onclick="navTo('home')" class="font-bold text-lg cursor-pointer flex items-center gap-2">
              <i class="fa-solid fa-graduation-cap"></i> Tài Liệu Ôn Tập THCS & THPT
            </div>
            <div class="flex items-center gap-4 text-sm font-medium">
              ${navButtons}
              <span class="bg-blue-700 px-3 py-1 rounded">${myAppState.currentUser.username}</span>
              <button onclick="logOut()" class="text-red-200 hover:text-white"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
          </header>

          <main class="max-w-6xl w-full mx-auto p-4 flex-1">
            ${mainArea}
          </main>
        </div>

        <!-- MODAL THÊM LỘ TRÌNH -->
        <div id="modalRoadmap" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded p-6 max-w-md w-full space-y-3 shadow-xl">
            <h3 class="font-bold text-lg text-red-800">Thêm Lộ Trình Mới</h3>
            <form id="formAddRoadmap" class="space-y-3 text-sm">
              <div>
                <label class="block text-xs font-semibold mb-1">Tên lộ trình (Ví dụ: LỘ TRÌNH T3...)</label>
                <input type="text" id="rmTitle" required class="w-full p-2 border rounded text-xs" placeholder="Nhập tên lộ trình...">
              </div>
              <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onclick="closeModal('modalRoadmap')" class="px-3 py-1.5 border rounded text-xs">Hủy</button>
                <button type="submit" class="bg-red-700 text-white px-4 py-1.5 rounded text-xs font-medium hover:bg-red-800">Tạo Lộ Trình</button>
              </div>
            </form>
          </div>
        </div>

        <!-- MODAL THÊM CHƯƠNG VÀO LỘ TRÌNH -->
        <div id="modalChapter" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded p-6 max-w-md w-full space-y-3 shadow-xl">
            <h3 class="font-bold text-lg text-amber-800">Thêm Chương / Chuyên Đề</h3>
            <form id="formAddChapter" class="space-y-3 text-sm">
              <div>
                <label class="block text-xs font-semibold mb-1">Chọn lộ trình</label>
                <select id="selectRmId" class="w-full p-2 border rounded text-xs bg-white">
                  ${myAppState.roadmaps.map(r => `<option value="${r.id}">${r.title}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">Tên chương / Chuyên đề</label>
                <input type="text" id="chapTitle" required class="w-full p-2 border rounded text-xs" placeholder="Ví dụ: Chương I: ...">
              </div>
              <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onclick="closeModal('modalChapter')" class="px-3 py-1.5 border rounded text-xs">Hủy</button>
                <button type="submit" class="bg-amber-600 text-white px-4 py-1.5 rounded text-xs font-medium hover:bg-amber-700">Thêm Chương</button>
              </div>
            </form>
          </div>
        </div>

        <!-- MODAL ĐĂNG BÀI GIẢNG -->
        <div id="modalLec" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded p-6 max-w-lg w-full space-y-3 shadow-xl max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-lg text-blue-800"><i class="fa-solid fa-book-open mr-1.5"></i> Đăng Bài Giảng Mới</h3>
            <form id="formAddLec" class="space-y-3 text-sm">
              <div>
                <label class="block text-xs font-semibold mb-1">Tên bài học</label>
                <input type="text" id="lecTitle" required class="w-full p-2 border rounded text-xs">
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-semibold mb-1">Môn học</label>
                  <select id="lecSubject" class="w-full p-2 border rounded text-xs bg-white">
                    <option value="Toán 9">Toán 9</option>
                    <option value="Toán 8">Toán 8</option>
                    <option value="Toán 7">Toán 7</option>
                    <option value="Đại số 10">Đại số 10</option>
                    <option value="Hình học 11">Hình học 11</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Thuộc chuyên đề / Chương</label>
                  <select id="lecChapter" class="w-full p-2 border rounded text-xs bg-white">
                    ${allChaptersList.map(c => `<option value="${c}">${c}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div class="space-y-2 border p-3 rounded bg-blue-50/50">
                <span class="font-bold text-xs text-blue-900 block border-b pb-1">Tài liệu bài giảng đính kèm:</span>
                <div>
                  <label class="block text-[10px] font-semibold text-gray-700">1. File tài liệu / lý thuyết (PDF / Word / Ảnh)</label>
                  <input type="file" id="lecFileInput" accept="application/pdf,image/*,.doc,.docx" class="w-full p-1.5 border rounded text-xs bg-white">
                </div>
                <div>
                  <label class="block text-[10px] font-semibold text-gray-700">2. File hướng dẫn giải / đáp án chi tiết (PDF / Word / Ảnh)</label>
                  <input type="file" id="lecSolutionInput" accept="application/pdf,image/*,.doc,.docx" class="w-full p-1.5 border rounded text-xs bg-white">
                </div>
                <div>
                  <label class="block text-[10px] font-semibold text-gray-700">3. Link Video bài giảng (YouTube hoặc link MP4)</label>
                  <input type="text" id="lecVideoInput" placeholder="https://youtube.com/..." class="w-full p-2 border rounded text-xs bg-white">
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold mb-1">Mô tả bài học</label>
                <textarea id="lecDesc" rows="2" class="w-full p-2 border rounded text-xs"></textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onclick="closeModal('modalLec')" class="px-3 py-1.5 border rounded text-xs">Hủy</button>
                <button type="submit" class="bg-blue-600 text-white px-4 py-1.5 rounded text-xs font-medium hover:bg-blue-700">Đăng Bài Giảng</button>
              </div>
            </form>
          </div>
        </div>
      `;

      if (document.getElementById('formAddRoadmap')) {
        document.getElementById('formAddRoadmap').onsubmit = (e) => {
          e.preventDefault();
          const t = document.getElementById('rmTitle').value.trim();
          db.ref('roadmaps').push({ title: t, chapters: [] }, err => {
            if (!err) {
              alert('Đã tạo lộ trình thành công!');
              closeModal('modalRoadmap');
            }
          });
        };
      }

      if (document.getElementById('formAddChapter')) {
        document.getElementById('formAddChapter').onsubmit = (e) => {
          e.preventDefault();
          const rmId = document.getElementById('selectRmId').value;
          const chapTitle = document.getElementById('chapTitle').value.trim();
          const rm = myAppState.roadmaps.find(r => r.id === rmId);
          if (rm) {
            let chapters = rm.chapters || [];
            chapters.push(chapTitle);
            db.ref('roadmaps/' + rmId).update({ chapters: chapters }, err => {
              if (!err) {
                alert('Đã thêm chương thành công!');
                closeModal('modalChapter');
              }
            });
          }
        };
      }

      if (document.getElementById('formAddLec')) {
        document.getElementById('formAddLec').onsubmit = (e) => {
          e.preventDefault();
          const fileInput = document.getElementById('lecFileInput');
          const solutionInput = document.getElementById('lecSolutionInput');
          const videoInputVal = document.getElementById('lecVideoInput').value.trim();

          let fUrl = '', fName = '', sUrl = '';

          const saveLectureData = () => {
            const newLec = {
              title: document.getElementById('lecTitle').value,
              subject: document.getElementById('lecSubject').value,
              chapter: document.getElementById('lecChapter').value,
              fileUrl: fUrl,
              fileName: fName,
              solutionUrl: sUrl,
              videoUrl: videoInputVal,
              description: document.getElementById('lecDesc').value,
              instructor: 'Hai Ton',
              date: new Date().toISOString().split('T')[0]
            };
            db.ref('lectures').push(newLec, err => {
              if (!err) {
                alert('Đăng bài giảng thành công!');
                closeModal('modalLec');
              }
            });
          };

          const readSolution = () => {
            if (solutionInput && solutionInput.files && solutionInput.files[0]) {
              const reader = new FileReader();
              reader.onload = (ev) => { sUrl = ev.target.result; saveLectureData(); };
              reader.readAsDataURL(solutionInput.files[0]);
            } else {
              saveLectureData();
            }
          };

          if (fileInput && fileInput.files && fileInput.files[0]) {
            fName = fileInput.files[0].name;
            const reader = new FileReader();
            reader.onload = (ev) => { fUrl = ev.target.result; readSolution(); };
            reader.readAsDataURL(fileInput.files[0]);
          } else {
            readSolution();
          }
        };
      }
    }

    function navTo(v) { myAppState.view = v; renderUI(); }
    function pickSubject(s) { myAppState.selectedSubject = s; renderUI(); }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    async function sendAIMessage() {
      const input = document.getElementById('aiChatInput');
      const msgContainer = document.getElementById('aiChatMessages');
      const text = input.value.trim();
      if (!text) return;

      msgContainer.innerHTML += `
        <div class="flex justify-end">
          <div class="bg-blue-600 text-white p-2.5 rounded-xl max-w-[85%]">${text}</div>
        </div>
      `;
      input.value = '';
      msgContainer.scrollTop = msgContainer.scrollHeight;

      const loadingId = 'loading_' + Date.now();
      msgContainer.innerHTML += `
        <div id="${loadingId}" class="flex justify-start">
          <div class="bg-blue-50 text-blue-900 p-2.5 rounded-xl border border-blue-100 max-w-[85%] flex items-center gap-2">
            <i class="fa-solid fa-spinner animate-spin"></i> Trợ giảng AI đang suy nghĩ...
          </div>
        </div>
      `;
      msgContainer.scrollTop = msgContainer.scrollHeight;

      try {
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=YOUR_GEMINI_API_KEY", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: "Bạn là trợ giảng môn Toán. Hãy hướng dẫn câu hỏi: " + text }] }] })
        });
        const data = await response.json();
        document.getElementById(loadingId).remove();
        let aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Mình đã nhận được câu hỏi. Bạn hãy kiểm tra lại các bước tính toán nhé!";
        msgContainer.innerHTML += `<div class="flex justify-start"><div class="bg-blue-50 text-blue-900 p-2.5 rounded-xl border border-blue-100 max-w-[85%] whitespace-pre-wrap">${aiReply}</div></div>`;
      } catch (err) {
        document.getElementById(loadingId).remove();
        msgContainer.innerHTML += `<div class="flex justify-start"><div class="bg-red-50 text-red-700 p-2.5 rounded-xl border border-red-100 max-w-[85%]">Lỗi kết nối AI.</div></div>`;
      }
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    bootApp();
  </script>
</body>
</html>
