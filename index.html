<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Bài Giảng & Tài Liệu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialLectures = [
      {
        id: 1,
        title: "Bài 1: Giải hệ phương trình bậc nhất hai ẩn",
        subject: "Toán 9",
        instructor: "Thầy Giáo Toán",
        date: "2026-10-28",
        videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
        description: "Hướng dẫn chi tiết phương pháp thế và cộng đại số kèm bài tập luyện tập.",
        files: [
          { name: "De_thi_am_tap_Toan9.pdf", size: "3.5 MB", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" }
        ]
      },
      {
        id: 2,
        title: "Bài 2: Phân tích đa thức thành nhân tử",
        subject: "Toán 8",
        instructor: "Thầy Giáo Toán",
        date: "2026-10-25",
        videoUrl: "https://www.w3schools.com/html/movie.mp4",
        description: "Các phương pháp đặt nhân tử chung, dùng hằng đẳng thức và nhóm hạng tử.",
        files: [
          { name: "Bai_tap_Phan_tich_da_thuc.pdf", size: "2.1 MB", url: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" }
        ]
      }
    ];

    function App() {
      const [lectures, setLectures] = useState(() => {
        const saved = localStorage.getItem('my_lectures');
        return saved ? JSON.parse(saved) : initialLectures;
      });
      const [selectedLecture, setSelectedLecture] = useState(lectures[0]);
      const [showModal, setShowModal] = useState(false);
      const [view, setView] = useState('home');

      // Form đăng bài mới
      const [formData, setFormData] = useState({
        title: '',
        subject: 'Toán 9',
        instructor: '',
        videoUrl: '',
        fileUrl: '',
        fileName: '',
        fileSize: '2.5 MB',
        description: ''
      });

      useEffect(() => {
        localStorage.setItem('my_lectures', JSON.stringify(lectures));
      }, [lectures]);

      const handleAdd = (e) => {
        e.preventDefault();
        const newItem = {
          id: Date.now(),
          title: formData.title,
          subject: formData.subject,
          instructor: formData.instructor || "Giáo viên",
          date: new Date().toISOString().split('T')[0],
          videoUrl: formData.videoUrl || "https://www.w3schools.com/html/mov_bbb.mp4",
          description: formData.description,
          files: formData.fileName ? [
            { 
              name: formData.fileName, 
              size: formData.fileSize || "2.0 MB", 
              url: formData.fileUrl || "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" 
            }
          ] : []
        };
        const updated = [newItem, ...lectures];
        setLectures(updated);
        setSelectedLecture(newItem);
        setShowModal(false);
        setFormData({ title: '', subject: 'Toán 9', instructor: '', videoUrl: '', fileUrl: '', fileName: '', fileSize: '2.5 MB', description: '' });
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* Thanh Navbar / Trang chủ */}
          <header class="bg-blue-600 text-white shadow-md py-3 px-6 flex justify-between items-center sticky top-0 z-40">
            <div 
              onClick={() => setView('home')} 
              class="flex items-center space-x-3 cursor-pointer hover:opacity-90"
            >
              <i class="fa-solid fa-graduation-cap text-2xl"></i>
              <span class="text-xl font-bold tracking-wide">Trang Chủ Bài Giảng</span>
            </div>

            <div class="flex items-center space-x-3">
              <button 
                onClick={() => setView('home')} 
                class={`px-3 py-1.5 rounded-lg text-sm font-medium ${view === 'home' ? 'bg-blue-800' : 'hover:bg-blue-500'}`}
              >
                <i class="fa-solid fa-house mr-1"></i> Trang chủ
              </button>
              <button 
                onClick={() => setShowModal(true)} 
                class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow flex items-center"
              >
                <i class="fa-solid fa-plus mr-1"></i> Đăng Bài Mới
              </button>
            </div>
          </header>

          {/* Nội dung chính */}
          <div class="max-w-6xl w-full mx-auto p-4 md:p-6 flex-1">
            {view === 'home' ? (
              <div>
                <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                  <i class="fa-solid fa-book-open text-blue-600 mr-2"></i> Danh Sách Bài Giảng & Tài Liệu
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {lectures.map(item => (
                    <div key={item.id} class="bg-white rounded-xl shadow border hover:shadow-lg transition flex flex-col justify-between p-5">
                      <div>
                        <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded font-semibold">
                          {item.subject}
                        </span>
                        <h3 class="font-bold text-lg text-gray-900 mt-2 line-clamp-2">{item.title}</h3>
                        <p class="text-xs text-gray-500 mt-1"><i class="fa-regular fa-calendar"></i> {item.date}</p>
                        <p class="text-sm text-gray-600 mt-3 line-clamp-2">{item.description}</p>
                      </div>

                      <div class="mt-5 border-t pt-3 flex items-center justify-between">
                        <button 
                          onClick={() => { setSelectedLecture(item); setView('detail'); }} 
                          class="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700 font-medium"
                        >
                          <i class="fa-solid fa-circle-play mr-1"></i> Học ngay
                        </button>
                        <span class="text-xs text-gray-500"><i class="fa-solid fa-paperclip mr-1"></i> {item.files.length} tài liệu</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              /* Trang xem chi tiết bài học */
              <div class="bg-white rounded-xl shadow-md p-6">
                <button 
                  onClick={() => setView('home')} 
                  class="mb-4 text-blue-600 hover:underline flex items-center text-sm font-medium"
                >
                  <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại Trang Chủ
                </button>

                <h1 class="text-2xl font-bold text-gray-900 mb-2">{selectedLecture.title}</h1>
                <div class="flex items-center space-x-4 text-sm text-gray-500 mb-4">
                  <span>Môn: <b>{selectedLecture.subject}</b></span>
                  <span>Giảng viên: <b>{selectedLecture.instructor}</b></span>
                </div>

                {/* Video Player */}
                <div class="bg-black aspect-video rounded-lg overflow-hidden mb-6">
                  <video controls class="w-full h-full">
                    <source src={selectedLecture.videoUrl} type="video/mp4" />
                    Trình duyệt không hỗ trợ phát video.
                  </video>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border mb-6">
                  <h3 class="font-bold text-gray-800 mb-1">Mô tả bài học:</h3>
                  <p class="text-gray-700 text-sm leading-relaxed">{selectedLecture.description}</p>
                </div>

                {/* Giao diện khung tải file giống hệt ảnh mẫu bạn gửi */}
                <div class="border-t pt-4">
                  <h3 class="font-bold text-gray-800 mb-3 flex items-center">
                    <i class="fa-solid fa-folder-open text-blue-600 mr-2"></i> Tài liệu đính kèm bài học:
                  </h3>
                  {selectedLecture.files && selectedLecture.files.length > 0 ? (
                    <div class="space-y-3">
                      {selectedLecture.files.map((file, idx) => (
                        <div key={idx} class="flex items-center justify-between bg-gray-50 hover:bg-gray-100 p-4 rounded-xl border border-gray-200 transition shadow-sm">
                          <div class="flex items-center space-x-3">
                            {/* Icon PDF đỏ chuẩn mẫu */}
                            <i class="fa-solid fa-file-pdf text-red-500 text-3xl"></i>
                            <div>
                              <p class="font-semibold text-gray-900 text-sm">{file.name}</p>
                              <p class="text-xs text-gray-500 mt-0.5">{file.size}</p>
                            </div>
                          </div>
                          <a 
                            href={file.url} 
                            target="_blank" 
                            download 
                            class="text-indigo-600 hover:text-indigo-800 font-medium text-sm flex items-center space-x-1.5 bg-white px-3.5 py-2 rounded-lg border border-gray-200 shadow-sm"
                          >
                            <i class="fa-solid fa-download"></i>
                            <span>Tải xuống</span>
                          </a>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p class="text-sm text-gray-500 italic">Không có tài liệu đính kèm.</p>
                  )}
                </div>
              </div>
            )}
          </div>

          {/* Modal Đăng Bài Giảng Mới */}
          {showModal && (
            <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
                <h3 class="text-lg font-bold mb-4 text-gray-800">Đăng Bài Giảng & Tài Liệu Mới</h3>
                <form onSubmit={handleAdd} class="space-y-3">
                  <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Tiêu đề bài học</label>
                    <input required type="text" class="w-full p-2 border rounded text-sm" value={formData.title} onChange={e=>setFormData({...formData, title: e.target.value})} />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-xs font-semibold text-gray-600 mb-1">Môn học</label>
                      <input type="text" class="w-full p-2 border rounded text-sm" value={formData.subject} onChange={e=>setFormData({...formData, subject: e.target.value})} />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-600 mb-1">Giảng viên</label>
                      <input type="text" class="w-full p-2 border rounded text-sm" value={formData.instructor} onChange={e=>setFormData({...formData, instructor: e.target.value})} />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Link Video MP4 (URL)</label>
                    <input type="url" placeholder="https://..." class="w-full p-2 border rounded text-sm" value={formData.videoUrl} onChange={e=>setFormData({...formData, videoUrl: e.target.value})} />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Tên file tài liệu (VD: De_thi_Toan9.pdf)</label>
                    <input type="text" placeholder="De_thi_Toan9.pdf" class="w-full p-2 border rounded text-sm" value={formData.fileName} onChange={e=>setFormData({...formData, fileName: e.target.value})} />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-xs font-semibold text-gray-600 mb-1">Dung lượng (VD: 3.5 MB)</label>
                      <input type="text" class="w-full p-2 border rounded text-sm" value={formData.fileSize} onChange={e=>setFormData({...formData, fileSize: e.target.value})} />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-600 mb-1">Link tải file (Google Drive URL)</label>
                      <input type="text" placeholder="https://..." class="w-full p-2 border rounded text-sm" value={formData.fileUrl} onChange={e=>setFormData({...formData, fileUrl: e.target.value})} />
                    </div>
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Mô tả bài học</label>
                    <textarea rows="2" class="w-full p-2 border rounded text-sm" value={formData.description} onChange={e=>setFormData({...formData, description: e.target.value})}></textarea>
                  </div>
                  <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={()=>setShowModal(false)} class="px-3 py-1.5 border rounded text-sm text-gray-600">Hủy</button>
                    <button type="submit" class="px-4 py-1.5 bg-blue-600 text-white rounded text-sm font-medium">Đăng Bài</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
