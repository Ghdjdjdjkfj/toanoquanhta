<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài Liệu Ôn Tập & Kiểm Tra Online - Toán 9</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <div id="app"></div>

  <!-- CHATBOT TRỢ GIẢNG AI NỔI -->
  <div id="aiChatWidget" class="fixed bottom-5 right-5 z-50 hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-80 md:w-96 border flex flex-col overflow-hidden h-[450px]">
      <div class="bg-blue-600 text-white p-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-robot text-lg"></i>
          <span class="font-bold text-sm">Trợ Giảng AI - Toán 9</span>
        </div>
        <button onclick="toggleAIChat()" class="text-white hover:text-gray-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="aiChatMessages" class="flex-1 p-3 overflow-y-auto space-y-3 text-xs bg-gray-50">
        <div class="bg-blue-50 text-blue-900 p-2.5 rounded-xl border border-blue-100 max-w-[85%]">
          Xin chào! Mình là trợ giảng AI. Bạn có thắc mắc gì về bài tập hoặc lý thuyết cần hỗ trợ không?
        </div>
      </div>
      <div class="p-2.5 bg-white border-t flex gap-2">
        <input type="text" id="aiChatInput" placeholder="Nhập câu hỏi toán..." class="flex-1 p-2 border rounded-xl text-xs outline-none focus:ring-1 focus:ring-blue-500" onkeydown="if(event.key==='Enter') sendAIMessage()">
        <button onclick="sendAIMessage()" class="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-semibold hover:bg-blue-700"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <button onclick="toggleAIChat()" id="aiChatToggleBtn" class="fixed bottom-5 right-5 z-40 bg-blue-600 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:bg-blue-700 transition transform hover:scale-105">
    <i class="fa-solid fa-comments text-2xl"></i>
  </button>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD73a7Wr2d2_u4FeSfigcZ2pfrL6ai-3iQ",
      authDomain: "webtoan9.firebaseapp.com",
      databaseURL: "https://webtoan9-default-rtdb.firebaseio.com",
      projectId: "webtoan9",
      storageBucket: "webtoan9.firebasestorage.app",
      messagingSenderId: "688386595335",
      appId: "1:688386595335:web:c77441d012b1dba56be8a2",
      measurementId: "G-NH4MZXP235"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const chaptersListToan9 = [
      'Tất cả',
      'Chương I: Phương trình và hệ phương trình bậc nhất hai ẩn',
      'Chương II: Phương trình và bất phương trình bậc nhất một ẩn',
      'Chương III: Căn bậc hai và căn bậc ba',
      'Chương IV: Hệ thức lượng trong tam giác vuông',
      'Chương V: Đường tròn',
      'Chương VI: Hàm số y=ax² (a≠0) và phương trình bậc hai một ẩn',
      'Chương VII: Tần số và tần số tương đối',
      'Chương VIII: Xác suất của biến cố trong một số mô hình xác suất đơn giản',
      'Chương IX: Đường tròn ngoại tiếp và đường tròn nội tiếp',
      'Chương X: Một số hình khối trong thực tiễn',
      'Giữa kỳ I', 'Cuối kỳ I', 'Giữa kỳ II', 'Cuối kỳ II',
      'Trắc nghiệm', 'Bài tập tự luyện', 'Chủ đề ôn thi vào 10', 'Đề chính thức Sở GD-ĐT Gia Lai'
    ];

    let myAppState = {
      currentUser: null,
      view: 'home',
      selectedSubject: 'Toán 9',
      selectedChapter: 'Tất cả',
      lectures: [],
      exams: [],
      students: [],
      submissions: [],
      activeExam: null,
      userAnswers: { mcq: {}, tf: {}, sa: {} },
      timeRemaining: 0,
      resultObj: null,
      timerRef: null
    };

    function bootApp() {
      db.ref('lectures').on('value', snap => {
        const d = snap.val();
        myAppState.lectures = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('exams').on('value', snap => {
        const d = snap.val();
        myAppState.exams = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('students').on('value', snap => {
        const d = snap.val();
        myAppState.students = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('submissions').on('value', snap => {
        const d = snap.val();
        myAppState.submissions = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })).reverse() : [];
        renderUI();
      });
    }

    function renderUI() {
      const rootDiv = document.getElementById('app');
      
      if (!myAppState.currentUser) {
        rootDiv.innerHTML = `
          <div class="min-h-screen bg-blue-600 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8">
              <h1 class="text-2xl font-bold text-center mb-1 text-gray-800">Tài Liệu Ôn Tập THCS & THPT</h1>
              <p class="text-center text-sm text-gray-500 mb-6">Hệ thống thi online chuẩn mới</p>
              <form id="loginForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold mb-1">Tên đăng nhập</label>
                  <input type="text" id="username" required class="w-full p-3 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Mật khẩu</label>
                  <input type="password" id="password" required class="w-full p-3 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700">Đăng Nhập</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('loginForm').onsubmit = (e) => {
          e.preventDefault();
          const u = document.getElementById('username').value;
          const p = document.getElementById('password').value;
          if (u === 'admin' && p === 'admin123') {
            myAppState.currentUser = { username: 'Admin', role: 'admin' };
          } else {
            const found = myAppState.students.find(s => s.username === u && s.password === p);
            if (found) myAppState.currentUser = { username: found.username, role: 'student' };
            else alert('Tài khoản hoặc mật khẩu không chính xác!');
          }
          renderUI();
        };
        return;
      }

      let navButtons = `
        <button onclick="navTo('home')" class="hover:underline font-semibold">Thư mục</button>
        <button onclick="navTo('exam_list')" class="hover:underline font-semibold">Kiểm tra</button>
      `;
      if (myAppState.currentUser.role === 'admin') {
        navButtons += `
          <button onclick="navTo('statistics')" class="hover:underline font-semibold">Thống kê</button>
          <button onclick="navTo('admin_panel')" class="hover:underline font-semibold">Quản lý HS</button>
        `;
      }

      let mainArea = '';

      if (myAppState.view === 'home') {
        const subjects = ['Toán 9', 'Toán 8', 'Toán 7', 'Đại số 10', 'Hình học 11', 'Ôn thi vào 10'];
        const filteredLectures = myAppState.lectures.filter(l => {
          const mSub = myAppState.selectedSubject === 'Tất cả' || l.subject === myAppState.selectedSubject;
          const mChap = myAppState.selectedChapter === 'Tất cả' || l.chapter === myAppState.selectedChapter;
          return mSub && mChap;
        });

        mainArea = `
          <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <div class="flex gap-2 overflow-x-auto pb-2">
              ${subjects.map(s => `<button onclick="pickSubject('${s}')" class="px-3 py-1.5 rounded text-sm font-medium ${myAppState.selectedSubject === s ? 'bg-blue-600 text-white' : 'bg-white border'}">${s}</button>`).join('')}
            </div>
            ${myAppState.currentUser.role === 'admin' ? `<button onclick="openModal('modalLec')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-green-700">+ Đăng Bài Giảng</button>` : ''}
          </div>

          <div class="bg-white p-3 rounded border mb-6 space-y-2">
            <span class="font-bold text-xs text-blue-700 uppercase tracking-wide block border-b pb-1"><i class="fa-solid fa-list-ul mr-1"></i> Danh mục bài học (${myAppState.selectedSubject}):</span>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${chaptersListToan9.map(c => `<button onclick="pickChapter('${c.replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded text-xs font-medium transition ${myAppState.selectedChapter === c ? 'bg-indigo-600 text-white shadow' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">${c}</button>`).join('')}
            </div>
          </div>

          ${filteredLectures.length === 0 ? `<p class="text-center text-gray-500 py-10 bg-white rounded border">Chưa có bài giảng nào trong mục này.</p>` : `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${filteredLectures.map(l => `
                <div class="bg-white p-4 rounded shadow border flex flex-col justify-between">
                  <div>
                    <span class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">${l.subject || 'Toán 9'}</span>
                    <p class="text-[11px] text-indigo-600 font-semibold mt-1 truncate">${l.chapter || ''}</p>
                    <h3 class="font-bold text-base mt-1">${l.title}</h3>
                    <p class="text-xs text-gray-500 mt-1">GV: ${l.instructor || 'Hai Ton'}</p>
                    <p class="text-xs text-gray-600 mt-2 line-clamp-2">${l.description || ''}</p>
                  </div>
                  <div class="mt-4 flex gap-2">
                    ${l.fileUrl ? `<a href="${l.fileUrl}" download="${l.fileName || 'TaiLieu'}" class="flex-1 bg-blue-600 text-white py-1.5 rounded text-xs font-semibold text-center hover:bg-blue-700"><i class="fa-solid fa-download mr-1"></i> Tải tài liệu</a>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      }

      else if (myAppState.view === 'exam_list') {
        mainArea = `
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Danh Sách Đề Kiểm Tra Online</h2>
            ${myAppState.currentUser.role === 'admin' ? `<button onclick="openModal('modalExam')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-green-700">+ Tạo Đề Thi (Tự Nhập Đáp Án)</button>` : ''}
          </div>
          ${myAppState.exams.length === 0 ? `<p class="text-gray-500 text-center py-8 bg-white rounded border">Chưa có đề kiểm tra nào.</p>` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${myAppState.exams.map(e => `
                <div class="bg-white p-4 rounded shadow border flex justify-between items-center">
                  <div>
                    <h3 class="font-bold text-blue-700">${e.title}</h3>
                    <p class="text-xs text-gray-500 mt-1">Thời gian: ${e.duration} phút | ${e.mcqCount || 0} Trắc nghiệm - ${e.saCount || 0} Trả lời ngắn</p>
                  </div>
                  <button onclick="launchExam('${e.id}')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-blue-700"><i class="fa-solid fa-pen-to-square mr-1"></i> Làm bài</button>
                </div>
              `).join('')}
            </div>
          `}
        `;
      }

      else if (myAppState.view === 'do_exam' && myAppState.activeExam) {
        const exam = myAppState.activeExam;
        const mm = Math.floor(myAppState.timeRemaining / 60);
        const ss = myAppState.timeRemaining % 60;

        mainArea = `
          <div class="bg-white rounded shadow-lg overflow-hidden flex flex-col h-[calc(100vh-100px)]">
            <div class="bg-blue-600 text-white p-3 flex justify-between items-center shrink-0">
              <h2 class="font-bold text-base truncate"><i class="fa-solid fa-file-signature mr-2"></i>${exam.title}</h2>
              ${!myAppState.resultObj ? `
                <div class="bg-red-500 text-white font-bold px-3 py-1 rounded text-sm shadow animate-pulse">
                  <i class="fa-solid fa-clock mr-1"></i> ${mm}:${ss.toString().padStart(2, '0')}
                </div>
              ` : `<div class="bg-green-600 text-white font-bold px-3 py-1 rounded text-sm">Đã nộp bài</div>`}
            </div>

            ${myAppState.resultObj ? `
              <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <div class="text-center bg-blue-50 p-6 rounded-xl border border-blue-100 max-w-xl mx-auto">
                  <div class="text-5xl font-bold text-blue-600 mb-2">${myAppState.resultObj.finalScore} <span class="text-xl text-gray-500">/ 10 điểm</span></div>
                  <p class="text-gray-700 text-sm mb-4">Bạn trả lời đúng ${myAppState.resultObj.correctCount} / ${myAppState.resultObj.totalQuestions} câu hỏi.</p>
                  <button onclick="navTo('exam_list')" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-semibold hover:bg-blue-700 text-sm">Quay lại danh sách đề thi</button>
                </div>

                <div class="max-w-3xl mx-auto space-y-4">
                  <h3 class="font-bold text-base text-gray-800 border-b pb-2"><i class="fa-solid fa-key mr-2"></i>Bảng tra cứu đáp án chi tiết:</h3>
                  
                  ${exam.mcqCount > 0 ? `
                    <div class="bg-white p-4 rounded-xl border shadow-sm">
                      <h4 class="font-bold text-xs text-blue-800 mb-3 uppercase">Phần I. Trắc nghiệm 4 lựa chọn</h4>
                      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                        ${Array.from({length: exam.mcqCount}).map((_, i) => {
                          const userAns = myAppState.userAnswers.mcq[i+1] || '(Chưa chọn)';
                          const correctAns = (exam.mcqKey || '').split(',')[i]?.trim().toUpperCase() || '?';
                          const isCorrect = userAns === correctAns;
                          return `
                            <div class="p-2 rounded border ${isCorrect ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'}">
                              <span class="font-bold">Câu ${i+1}:</span> Bạn: <b class="${isCorrect ? 'text-green-700' : 'text-red-700'}">${userAns}</b> | Đáp án: <b>${correctAns}</b>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  ` : ''}

                  ${exam.saCount > 0 ? `
                    <div class="bg-white p-4 rounded-xl border shadow-sm">
                      <h4 class="font-bold text-xs text-indigo-800 mb-3 uppercase">Phần II. Trả lời ngắn</h4>
                      <div class="space-y-2 text-xs">
                        ${Array.from({length: exam.saCount}).map((_, i) => {
                          const userAns = myAppState.userAnswers.sa[i+1] || '(Trống)';
                          const correctAns = (exam.saKey || '').split(',')[i]?.trim() || '?';
                          const isCorrect = userAns === correctAns;
                          return `
                            <div class="p-2 rounded border flex justify-between items-center ${isCorrect ? 'bg-green-50 border-green-300' : 'bg-red-50 border-red-300'}">
                              <span><b>Câu ${i+1}:</b> Bạn: "${userAns}"</span>
                              <span>Đáp án chuẩn: <b class="text-blue-700">"${correctAns}"</b></span>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  ` : ''}
                </div>
              </div>
            ` : `
              <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                <div class="w-full md:w-1/2 bg-gray-200 border-r flex flex-col h-1/2 md:h-full relative no-select" oncontextmenu="return false;">
                  <div class="bg-gray-700 text-white text-xs px-3 py-1.5 flex justify-between items-center">
                    <span><i class="fa-solid fa-eye mr-1"></i> Khung xem đề thi (Chỉ xem)</span>
                    <span class="text-[10px] bg-red-600 px-1.5 py-0.5 rounded">Bảo mật đề</span>
                  </div>
                  ${exam.fileUrl ? `
                    <iframe src="${exam.fileUrl}#toolbar=0&navpanes=0&scrollbar=1" class="w-full h-full border-none"></iframe>
                  ` : `<div class="p-8 text-center text-gray-500">Không có file đề đính kèm.</div>`}
                </div>

                <div class="w-full md:w-1/2 p-4 overflow-y-auto h-1/2 md:h-full bg-white space-y-6">
                  <h3 class="font-bold text-lg text-blue-800 border-b pb-2"><i class="fa-solid fa-list-check mr-2"></i>PHIẾU TÔ ĐÁP ÁN</h3>

                  ${(exam.mcqCount > 0) ? `
                    <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                      <h4 class="font-bold text-sm text-blue-900 mb-3">PHẦN I. Trắc nghiệm 4 lựa chọn</h4>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${Array.from({length: exam.mcqCount}).map((_, i) => `
                          <div class="flex items-center justify-between bg-white p-2 rounded border text-xs">
                            <span class="font-bold text-gray-700 w-12">Câu ${i+1}:</span>
                            <div class="flex gap-2">
                              ${['A','B','C','D'].map(opt => `
                                <button type="button" onclick="selectMCQ(${i+1}, '${opt}')" class="w-7 h-7 rounded-full font-bold border transition ${myAppState.userAnswers.mcq[i+1] === opt ? 'bg-blue-600 text-white border-blue-600 shadow' : 'bg-gray-50 text-gray-700 hover:bg-gray-200'}">${opt}</button>
                              `).join('')}
                            </div>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  ` : ''}

                  ${(exam.saCount > 0) ? `
                    <div class="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100">
                      <h4 class="font-bold text-sm text-indigo-900 mb-3">PHẦN II. Trả lời ngắn</h4>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${Array.from({length: exam.saCount}).map((_, i) => `
                          <div class="bg-white p-2.5 rounded border text-xs flex items-center gap-2">
                            <span class="font-bold text-indigo-800 shrink-0">Câu ${i+1}:</span>
                            <input type="text" placeholder="Nhập đáp án..." oninput="inputSA(${i+1}, this.value)" value="${myAppState.userAnswers.sa[i+1] || ''}" class="w-full p-1.5 border rounded outline-none focus:ring-1 focus:ring-indigo-500 text-xs">
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  ` : ''}

                  <button onclick="finishExam()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-green-700 transition"><i class="fa-solid fa-paper-plane mr-2"></i>NỘP BÀI THI</button>
                </div>
              </div>
            `}
          </div>
        `;
      }

      else if (myAppState.view === 'statistics') {
        mainArea = `
          <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-bold mb-4">Thống Kê Điểm Số Học Sinh</h2>
            ${myAppState.submissions.length === 0 ? `<p class="text-gray-500 text-center py-6">Chưa có dữ liệu bài nộp.</p>` : `
              <table class="w-full text-left text-sm border-collapse">
                <thead><tr class="bg-gray-100 border-b"><th class="p-2">Học sinh</th><th class="p-2">Bài thi</th><th class="p-2">Điểm số</th><th class="p-2">Thời gian nộp</th></tr></thead>
                <tbody>
                  ${myAppState.submissions.map(s => `<tr class="border-b"><td class="p-2 font-semibold">${s.studentName}</td><td class="p-2">${s.examTitle}</td><td class="p-2 font-bold text-blue-600">${s.score}</td><td class="p-2 text-xs text-gray-500">${s.date}</td></tr>`).join('')}
                </tbody>
              </table>
            `}
          </div>
        `;
      }

      else if (myAppState.view === 'admin_panel') {
        mainArea = `
          <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-bold mb-4">Quản Lý Tài Khoản Học Sinh</h2>
            <form id="addStuForm" class="flex gap-2 mb-6">
              <input type="text" id="stuUser" placeholder="Tên đăng nhập" required class="p-2 border rounded text-sm flex-1">
              <input type="text" id="stuPass" placeholder="Mật khẩu" required class="p-2 border rounded text-sm flex-1">
              <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-semibold">Cấp TK</button>
            </form>
            <table class="w-full text-left text-sm border-collapse">
              <thead><tr class="bg-gray-100 border-b"><th class="p-2">Tên đăng nhập</th><th class="p-2">Mật khẩu</th><th class="p-2 text-right">Thao tác</th></tr></thead>
              <tbody>
                ${myAppState.students.map(s => `<tr class="border-b"><td class="p-2 font-semibold">${s.username}</td><td class="p-2">${s.password}</td><td class="p-2 text-right"><button onclick="deleteStudent('${s.id}')" class="text-red-600 text-xs font-bold">Xóa</button></td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      rootDiv.innerHTML = `
        <div class="min-h-screen flex flex-col">
          <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow sticky top-0 z-40">
            <div onclick="navTo('home')" class="font-bold text-lg cursor-pointer flex items-center gap-2">
              <i class="fa-solid fa-graduation-cap"></i> Tài Liệu Ôn Tập THCS & THPT
            </div>
            <div class="flex items-center gap-4 text-sm font-medium">
              ${navButtons}
              <span class="bg-blue-700 px-3 py-1 rounded">${myAppState.currentUser.username}</span>
              <button onclick="logOut()" class="text-red-200 hover:text-white"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
          </header>

          <main class="max-w-6xl w-full mx-auto p-4 flex-1">
            ${mainArea}
          </main>
        </div>

        <!-- MODAL ĐĂNG BÀI GIẢNG -->
        <div id="modalLec" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded p-6 max-w-lg w-full space-y-3 shadow-xl max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-lg">Đăng Bài Giảng Mới</h3>
            <form id="formAddLec" class="space-y-3 text-sm">
              <div>
                <label class="block text-xs font-semibold mb-1">Tên bài học</label>
                <input type="text" id="lecTitle" required class="w-full p-2 border rounded">
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-xs font-semibold mb-1">Môn học</label>
                  <select id="lecSubject" class="w-full p-2 border rounded bg-white">
                    <option value="Toán 9">Toán 9</option>
                    <option value="Toán 8">Toán 8</option>
                    <option value="Toán 7">Toán 7</option>
                    <option value="Đại số 10">Đại số 10</option>
                    <option value="Hình học 11">Hình học 11</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Chương / Mục</label>
                  <select id="lecChapter" class="w-full p-2 border rounded bg-white">
                    ${chaptersListToan9.filter(c => c !== 'Tất cả').map(c => `<option value="${c}">${c}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">Chọn tệp tài liệu trực tiếp từ máy (PDF, Word, Ảnh...)</label>
                <input type="file" id="lecFileInput" class="w-full p-1.5 border rounded text-xs bg-gray-50">
              </div>
              <div>
                <label class="block text-xs font-semibold mb-1">Mô tả</label>
                <textarea id="lecDesc" rows="2" class="w-full p-2 border rounded"></textarea>
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal('modalLec')" class="px-3 py-1.5 border rounded">Hủy</button>
                <button type="submit" class="bg-blue-600 text-white px-4 py-1.5 rounded font-medium">Đăng Bài</button>
              </div>
            </form>
          </div>
        </div>

        <!-- MODAL TẠO ĐỀ THI (GIÁO VIÊN TỰ NHẬP HÀNG ĐÁP ÁN GỐC) -->
        <div id="modalExam" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-xl p-6 max-w-xl w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="font-bold text-lg text-blue-800">Tạo Đề Kiểm Tra (Tự Nhập Hàng Đáp Án)</h3>
            <form id="formAddExam" class="space-y-3 text-sm">
              <div>
                <label class="block text-xs font-semibold mb-1">Tên bài kiểm tra</label>
                <input type="text" id="examTitle" required class="w-full p-2 border rounded">
              </div>
              <div class="grid grid-cols-3 gap-2">
                <div>
                  <label class="block text-xs font-semibold mb-1">Thời gian (phút)</label>
                  <input type="number" id="examDuration" value="45" required class="w-full p-2 border rounded text-xs">
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Số câu TN</label>
                  <input type="number" id="mcqCount" value="12" class="w-full p-2 border rounded text-xs">
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Số câu TL ngắn</label>
                  <input type="number" id="saCount" value="4" class="w-full p-2 border rounded text-xs">
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold mb-1">Chọn tệp đề thi từ máy (PDF / Ảnh)</label>
                <input type="file" id="examFileInput" required accept="application/pdf,image/*" class="w-full p-1.5 border rounded text-xs bg-gray-50">
              </div>

              <div class="border p-3 rounded bg-gray-50 space-y-2">
                <span class="font-bold text-xs text-gray-700 block border-b pb-1">Thầy/Cô tự nhập hàng đáp án gốc:</span>
                <div>
                  <label class="block text-[10px] font-semibold text-blue-800">Đáp án Trắc nghiệm (Nhập cách nhau bởi dấu phẩy, ví dụ: A,B,C,D,A,B...)</label>
                  <input type="text" id="mcqKey" required placeholder="A,B,C,D,A,B,C,D,A,B,C,D" class="w-full p-2 border rounded text-xs bg-white font-mono">
                </div>
                <div>
                  <label class="block text-[10px] font-semibold text-indigo-800">Đáp án Trả lời ngắn (Nhập cách nhau bởi dấu phẩy, ví dụ: 12,-5,3.5,0)</label>
                  <input type="text" id="saKey" placeholder="12, -5, 3.5, 0" class="w-full p-2 border rounded text-xs bg-white font-mono">
                </div>
              </div>

              <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onclick="closeModal('modalExam')" class="px-3 py-1.5 border rounded">Hủy</button>
                <button type="submit" class="bg-blue-600 text-white px-4 py-1.5 rounded font-medium hover:bg-blue-700">Lưu Đề Thi</button>
              </div>
            </form>
          </div>
        </div>
      `;

      if (document.getElementById('addStuForm')) {
        document.getElementById('addStuForm').onsubmit = (e) => {
          e.preventDefault();
          const u = document.getElementById('stuUser').value;
          const p = document.getElementById('stuPass').value;
          db.ref('students').push({ username: u, password: p }, err => {
            if (!err) alert('Đã cấp tài khoản học sinh!');
          });
        };
      }

      if (document.getElementById('formAddLec')) {
        document.getElementById('formAddLec').onsubmit = (e) => {
          e.preventDefault();
          const fileInput = document.getElementById('lecFileInput');
          if (fileInput.files && fileInput.files[0]) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
              const newLec = {
                title: document.getElementById('lecTitle').value,
                subject: document.getElementById('lecSubject').value,
                chapter: document.getElementById('lecChapter').value,
                fileUrl: uploadEvent.target.result,
                fileName: file.name,
                description: document.getElementById('lecDesc').value,
                instructor: 'Hai Ton',
                date: new Date().toISOString().split('T')[0]
              };
              db.ref('lectures').push(newLec, err => {
                if (!err) {
                  alert('Đăng bài giảng thành công!');
                  closeModal('modalLec');
                }
              });
            };
            reader.readAsDataURL(file);
          } else {
            alert('Vui lòng chọn tệp tài liệu!');
          }
        };
      }

      if (document.getElementById('formAddExam')) {
        document.getElementById('formAddExam').onsubmit = (e) => {
          e.preventDefault();
          const fileInput = document.getElementById('examFileInput');
          if (fileInput.files && fileInput.files[0]) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
              const newExam = {
                title: document.getElementById('examTitle').value,
                duration: Number(document.getElementById('examDuration').value),
                fileUrl: uploadEvent.target.result,
                mcqCount: Number(document.getElementById('mcqCount').value),
                saCount: Number(document.getElementById('saCount').value),
                mcqKey: document.getElementById('mcqKey').value,
                saKey: document.getElementById('saKey').value
              };
              db.ref('exams').push(newExam, err => {
                if (!err) {
                  alert('Tạo đề kiểm tra thành công!');
                  closeModal('modalExam');
                }
              });
            };
            reader.readAsDataURL(file);
          }
        };
      }
    }

    function selectMCQ(qNum, val) { myAppState.userAnswers.mcq[qNum] = val; renderUI(); }
    function selectTF(qNum, subItem, val) { myAppState.userAnswers.tf[`${qNum}_${subItem}`] = val; renderUI(); }
    function inputSA(qNum, val) { myAppState.userAnswers.sa[qNum] = val.trim(); }

    function navTo(v) { 
      if (myAppState.timerRef) clearInterval(myAppState.timerRef);
      myAppState.view = v; 
      renderUI(); 
    }
    function pickSubject(s) { myAppState.selectedSubject = s; renderUI(); }
    function pickChapter(c) { myAppState.selectedChapter = c; renderUI(); }
    function logOut() { if(myAppState.timerRef) clearInterval(myAppState.timerRef); myAppState.currentUser = null; renderUI(); }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function deleteStudent(id) { if(confirm('Xóa học sinh này?')) db.ref('students/' + id).remove(); }

    function launchExam(examId) {
      const exam = myAppState.exams.find(e => e.id === examId);
      if (!exam) return;
      myAppState.activeExam = exam;
      myAppState.userAnswers = { mcq: {}, tf: {}, sa: {} };
      myAppState.timeRemaining = (exam.duration || 45) * 60;
      myAppState.resultObj = null;
      myAppState.view = 'do_exam';
      renderUI();

      if (myAppState.timerRef) clearInterval(myAppState.timerRef);
      myAppState.timerRef = setInterval(() => {
        if (myAppState.timeRemaining > 0 && !myAppState.resultObj) {
          myAppState.timeRemaining--;
          const clockEl = document.querySelector('.bg-red-500');
          if (clockEl) {
            const mm = Math.floor(myAppState.timeRemaining / 60);
            const ss = myAppState.timeRemaining % 60;
            clockEl.innerHTML = `<i class="fa-solid fa-clock mr-1"></i> ${mm}:${ss.toString().padStart(2, '0')}`;
          }
        } else if (myAppState.timeRemaining === 0 && !myAppState.resultObj) {
          clearInterval(myAppState.timerRef);
          finishExam();
        }
      }, 1000);
    }

    function finishExam() {
      if (myAppState.timerRef) clearInterval(myAppState.timerRef);
      if (!myAppState.activeExam) return;

      const exam = myAppState.activeExam;
      let totalCorrect = 0;
      let totalQuestions = (exam.mcqCount || 0) + (exam.saCount || 0);

      const mcqKeys = (exam.mcqKey || '').split(',').map(k => k.trim().toUpperCase());
      for (let i = 1; i <= exam.mcqCount; i++) {
        if (myAppState.userAnswers.mcq[i] && myAppState.userAnswers.mcq[i] === mcqKeys[i-1]) {
          totalCorrect++;
        }
      }

      const saKeys = (exam.saKey || '').split(',').map(k => k.trim());
      for (let i = 1; i <= exam.saCount; i++) {
        if (myAppState.userAnswers.sa[i] && myAppState.userAnswers.sa[i] === saKeys[i-1]) {
          totalCorrect++;
        }
      }

      const finalScore = totalQuestions > 0 ? Number(((totalCorrect / totalQuestions) * 10).toFixed(1)) : 10;

      const subData = {
        examTitle: exam.title,
        studentName: myAppState.currentUser.username,
        score: finalScore,
        date: new Date().toLocaleString()
      };

      db.ref('submissions').push(subData);
      myAppState.resultObj = { finalScore, correctCount: totalCorrect, totalQuestions };
      renderUI();
    }

    function toggleAIChat() {
      const widget = document.getElementById('aiChatWidget');
      const toggleBtn = document.getElementById('aiChatToggleBtn');
      if (widget.classList.contains('hidden')) {
        widget.classList.remove('hidden');
        toggleBtn.classList.add('hidden');
      } else {
        widget.classList.add('hidden');
        toggleBtn.classList.remove('hidden');
      }
    }

    async function sendAIMessage() {
      const input = document.getElementById('aiChatInput');
      const msgContainer = document.getElementById('aiChatMessages');
      const text = input.value.trim();
      if (!text) return;

      msgContainer.innerHTML += `
        <div class="flex justify-end">
          <div class="bg-blue-600 text-white p-2.5 rounded-xl max-w-[85%]">${text}</div>
        </div>
      `;
      input.value = '';
      msgContainer.scrollTop = msgContainer.scrollHeight;

      const loadingId = 'loading_' + Date.now();
      msgContainer.innerHTML += `
        <div id="${loadingId}" class="flex justify-start">
          <div class="bg-blue-50 text-blue-900 p-2.5 rounded-xl border border-blue-100 max-w-[85%] flex items-center gap-2">
            <i class="fa-solid fa-spinner animate-spin"></i> Trợ giảng AI đang suy nghĩ...
          </div>
        </div>
      `;
      msgContainer.scrollTop = msgContainer.scrollHeight;

      try {
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=YOUR_GEMINI_API_KEY", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: "Bạn là trợ giảng môn Toán. Hãy hướng dẫn câu hỏi: " + text }] }] })
        });
        const data = await response.json();
        document.getElementById(loadingId).remove();
        let aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Mình đã nhận được câu hỏi. Bạn hãy kiểm tra lại các bước tính toán nhé!";
        msgContainer.innerHTML += `<div class="flex justify-start"><div class="bg-blue-50 text-blue-900 p-2.5 rounded-xl border border-blue-100 max-w-[85%] whitespace-pre-wrap">${aiReply}</div></div>`;
      } catch (err) {
        document.getElementById(loadingId).remove();
        msgContainer.innerHTML += `<div class="flex justify-start"><div class="bg-red-50 text-red-700 p-2.5 rounded-xl border border-red-100 max-w-[85%]">Lỗi kết nối AI.</div></div>`;
      }
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    bootApp();
  </script>
</body>
</html>
