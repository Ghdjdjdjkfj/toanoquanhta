  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD73a7Wr2d2_u4FeSfigcZ2pfrL6ai-3iQ",
      authDomain: "webtoan9.firebaseapp.com",
      databaseURL: "https://webtoan9-default-rtdb.firebaseio.com",

      measurementId: "G-NH4MZXP235"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const chaptersListToan9 = [
      'Tất cả',
      'Chương I: Phương trình và hệ phương trình bậc nhất hai ẩn',
      'Chương II: Phương trình và bất phương trình bậc nhất một ẩn',

      'Chương V: Đường tròn',
      'Chương VI: Hàm số y=ax² (a≠0) và phương trình bậc hai một ẩn',
      'Chương VII: Tần số và tần số tương đối',
      'Chương VIII: Xác suất của biến cố trong một số mô hình xác suất đơn giản',
      'Chương IX: Đường tròn ngoại tiếp và đường tròn nội tiếp',

      'Giữa kỳ I', 'Cuối kỳ I', 'Giữa kỳ II', 'Cuối kỳ II',
      'Trắc nghiệm', 'Bài tập tự luyện', 'Chủ đề ôn thi vào 10', 'Đề chính thức Sở GD-ĐT Gia Lai'
    ];

    let myAppState = {
      currentUser: null,
      view: 'home',
      selectedSubject: 'Toán 9',
      selectedChapter: 'Tất cả',
      lectures: [],
      exams: [],
      questions: [],
      students: [],
      submissions: [],
      activeExam: null,
      userAnswers: { mcq: {}, tf: {}, sa: {} },
      timeRemaining: 0,
      resultObj: null,
      timerRef: null,
      tetTimerInterval: null
    };

    function bootApp() {
      db.ref('lectures').on('value', snap => {
        const d = snap.val();
        myAppState.lectures = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('exams').on('value', snap => {
        const d = snap.val();
        myAppState.exams = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('questions').on('value', snap => {
        const d = snap.val();
        myAppState.questions = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('students').on('value', snap => {
        const d = snap.val();
        myAppState.students = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('submissions').on('value', snap => {
        const d = snap.val();
        myAppState.submissions = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })).reverse() : [];
        renderUI();
      });
    }

    // CÂU CHÚC HỌC TẬP & ĐỘNG LỰC MỖI NGÀY (THAY CHO CHÚC TẾT)
    const studyWishes = [
      "Học, học nữa, học mãi! Thành công luôn đến với những ai kiên trì ôn luyện mỗi ngày.",
      "Kiến thức là sức mạnh. Chúc bạn hôm nay tiếp thu thật nhiều điều mới mẻ và bổ ích!",
      "Mỗi bài toán giải được là một bước tiến gần hơn đến ước mơ và cánh cửa trường chuyên lớp chọn!",
      "Không có con đường nào ngắn nhất dẫn đến thành công ngoài sự nỗ lực và tự học.",
      "Hãy làm những việc khó khi chúng còn dễ, làm những việc lớn khi chúng còn nhỏ. Cố lên!",
      "Toán học rèn luyện tư duy logic. Chúc bạn luôn giữ vững phong độ và sự tập trung cao độ!",
      "Sự chuẩn bị vững chắc hôm nay chính là tấm vé thông hành cho kỳ thi tuyệt vời ngày mai!"
    ];

    function getDailyStudyWish() {
      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
      return studyWishes[dayOfYear % studyWishes.length];
    }

    function getNextHoliday() {
      const now = new Date();
      const currentYear = now.getFullYear();
      const holidays = [
        { name: "Ngày Nhà giáo Việt Nam (20/11)", month: 11, day: 20 },
        { name: "Tết Dương Lịch (01/01)", month: 1, day: 1 },
        { name: "Ngày Giải phóng Miền Nam (30/04)", month: 4, day: 30 },
        { name: "Ngày Quốc tế Lao động (01/05)", month: 5, day: 1 },
        { name: "Ngày Quốc khánh (02/09)", month: 9, day: 2 },
        { name: "Ngày Phụ nữ Việt Nam (20/10)", month: 10, day: 20 }
      ];

      let upcoming = null;
      let minDiff = Infinity;
      holidays.forEach(h => {
        let hDate = new Date(currentYear, h.month - 1, h.day);
        if (hDate < now) hDate = new Date(currentYear + 1, h.month - 1, h.day);
        const diff = hDate - now;
        if (diff < minDiff) {
          minDiff = diff;
          upcoming = { name: h.name, date: hDate, diffDays: Math.ceil(diff / (1000 * 60 * 60 * 24)) };
        }
      });
      return upcoming;
    }

    function startTetCountdown() {
      if (myAppState.tetTimerInterval) clearInterval(myAppState.tetTimerInterval);
      const tet2027Date = new Date('2027-02-06T00:00:00');

      function updateTimer() {
        const now = new Date();
        const diff = tet2027Date - now;
        const boxesEl = document.getElementById('tetCountdownBoxes');
        const holidayEl = document.getElementById('holidayCountdownDisplay');
        if (!boxesEl) return;

        if (diff <= 0) {
          boxesEl.innerHTML = `<div class="text-yellow-300 font-bold text-lg py-2">🧧 Chúc mừng năm mới 2027! Gặt hái điểm 10 rực rỡ!</div>`;
        } else {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          boxesEl.innerHTML = `
            <div class="flex items-center gap-2 sm:gap-3 my-1">
              <div class="flex flex-col items-center">
                <div class="bg-black/40 border border-yellow-400/40 text-yellow-300 font-black text-lg sm:text-2xl px-2.5 sm:px-3.5 py-1 rounded-xl shadow-md min-w-[48px] text-center font-mono">${String(days).padStart(2, '0')}</div>
                <span class="text-[9px] sm:text-[10px] text-yellow-200 uppercase mt-1 font-bold">Ngày</span>
              </div>
              <span class="text-yellow-300 font-bold text-lg pb-4">:</span>
              <div class="flex flex-col items-center">
                <div class="bg-black/40 border border-yellow-400/40 text-yellow-300 font-black text-lg sm:text-2xl px-2.5 sm:px-3.5 py-1 rounded-xl shadow-md min-w-[48px] text-center font-mono">${String(hours).padStart(2, '0')}</div>
                <span class="text-[9px] sm:text-[10px] text-yellow-200 uppercase mt-1 font-bold">Giờ</span>
              </div>
              <span class="text-yellow-300 font-bold text-lg pb-4">:</span>
              <div class="flex flex-col items-center">
                <div class="bg-black/40 border border-yellow-400/40 text-yellow-300 font-black text-lg sm:text-2xl px-2.5 sm:px-3.5 py-1 rounded-xl shadow-md min-w-[48px] text-center font-mono">${String(minutes).padStart(2, '0')}</div>
                <span class="text-[9px] sm:text-[10px] text-yellow-200 uppercase mt-1 font-bold">Phút</span>
              </div>
              <span class="text-yellow-300 font-bold text-lg pb-4">:</span>
              <div class="flex flex-col items-center">
                <div class="bg-black/40 border border-yellow-400/40 text-yellow-300 font-black text-lg sm:text-2xl px-2.5 sm:px-3.5 py-1 rounded-xl shadow-md min-w-[48px] text-center font-mono">${String(seconds).padStart(2, '0')}</div>
                <span class="text-[9px] sm:text-[10px] text-yellow-200 uppercase mt-1 font-bold">Giây</span>
              </div>
            </div>
          `;
        }

        if (holidayEl) {
          const nextH = getNextHoliday();
          if (nextH) holidayEl.innerHTML = `🎉 Sự kiện tiếp theo: <b class="text-amber-200">${nextH.name}</b> - còn <b class="text-yellow-300 font-bold">${nextH.diffDays} ngày</b>!`;
        }
      }
      updateTimer();
      myAppState.tetTimerInterval = setInterval(updateTimer, 1000);
    }

    // XUẤT FILE NGÂN HÀNG CÂU HỎI
    function exportQuestionBank() {
      if (myAppState.questions.length === 0) {
        alert('Ngân hàng câu hỏi trống!');
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(myAppState.questions, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "NganHangCauHoi_Toan9.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8">
              <h1 class="text-2xl font-bold text-center mb-1 text-gray-800">Tài Liệu Ôn Tập THCS & THPT</h1>

              <form id="loginForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold mb-1">Tên đăng nhập</label>
                  <input type="text" id="username" required class="w-full p-3 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Mật khẩu</label>
                  <input type="password" id="password" required class="w-full p-3 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700">Đăng Nhập</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('loginForm').onsubmit = (e) => {
          e.preventDefault();
          const u = document.getElementById('username').value;
          const p = document.getElementById('password').value;
          if (u === 'admin' && p === 'admin123') {
            myAppState.currentUser = { username: 'Admin', role: 'admin' };
          } else {
            const found = myAppState.students.find(s => s.username === u && s.password === p);
            if (found) myAppState.currentUser = { username: found.username, role: 'student' };
            else alert('Tài khoản hoặc mật khẩu không chính xác!');
          }
          renderUI();
        };
        return;

      let navButtons = `
        <button onclick="navTo('home')" class="hover:underline font-semibold">Thư mục</button>
        <button onclick="navTo('exam_list')" class="hover:underline font-semibold">Kiểm tra</button>

        `;
      }

          const mChap = myAppState.selectedChapter === 'Tất cả' || l.chapter === myAppState.selectedChapter;
          return mSub && mChap;
        });

        mainArea = `
          <!-- BANNER ĐỘNG LỰC & ĐẾM NGƯỢC -->
          <div id="tetBannerContent" class="bg-gradient-to-r from-blue-700 via-indigo-600 to-purple-600 text-white p-4 sm:p-5 rounded-2xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border border-blue-400">
            <div class="space-y-2 text-center md:text-left flex-1">
              <div class="text-[11px] uppercase tracking-widest text-yellow-300 font-bold flex items-center justify-center md:justify-start gap-1">

              </div>
              <div id="tetCountdownBoxes" class="flex justify-center md:justify-start"></div>
              <div id="holidayCountdownDisplay" class="text-xs text-blue-100 font-medium">Đang tính sự kiện tiếp theo...</div>
              <div class="text-xs text-yellow-100 italic pt-1 border-t border-blue-400/50"><i class="fa-solid fa-quote-left mr-1"></i> ${getDailyStudyWish()}</div>
            </div>
            <div class="bg-black/30 p-3 sm:p-4 rounded-2xl text-center border border-white/20 shrink-0 shadow-inner">
              <span class="text-[10px] uppercase block text-yellow-300 font-bold tracking-wider">Mục tiêu ôn thi</span>
              <span class="text-base sm:text-lg font-black text-white">Điểm 10 Trong Tầm Tay</span>
            </div>
          </div>

          <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <div class="flex gap-2 overflow-x-auto pb-2">
              ${subjects.map(s => `<button onclick="pickSubject('${s}')" class="px-3 py-1.5 rounded text-sm font-medium ${myAppState.selectedSubject === s ? 'bg-blue-600 text-white' : 'bg-white border'}">${s}</button>`).join('')}
            </div>
            ${myAppState.currentUser.role === 'admin' ? `<button onclick="openModal('modalLec')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-green-700">+ Đăng Bài Giảng</button>` : ''}
          </div>

          <div class="bg-white p-3 rounded border mb-6 space-y-2">
            <span class="font-bold text-xs text-blue-700 uppercase tracking-wide block border-b pb-1"><i class="fa-solid fa-list-ul mr-1"></i> Danh mục bài học (${myAppState.selectedSubject}):</span>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${chaptersListToan9.map(c => `<button onclick="pickChapter('${c.replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded text-xs font-medium transition ${myAppState.selectedChapter === c ? 'bg-indigo-600 text-white shadow' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">${c}</button>`).join('')}

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${filteredLectures.map(l => `
                <div class="bg-white p-4 rounded shadow border flex flex-col justify-between">
                  <div>
                    <span class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">${l.subject || 'Toán 9'}</span>

                    ${l.videoUrl ? `<a href="${l.videoUrl}" target="_blank" class="bg-red-600 text-white px-3 py-1.5 rounded text-xs font-semibold text-center hover:bg-red-700" title="Xem video bài giảng"><i class="fa-solid fa-play"></i></a>` : ''}

              `).join('')}
            </div>

        `;
        setTimeout(startTetCountdown, 50);
      }

      else if (myAppState.view === 'exam_list') {
        mainArea = `
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Danh Sách Đề Kiểm Tra Online</h2>
            ${myAppState.currentUser.role === 'admin' ? `<button onclick="openModal('modalExam')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-green-700">+ Tạo Đề Thi Mới</button>` : ''}
          </div>
          ${myAppState.exams.length === 0 ? `<p class="text-gray-500 text-center py-8 bg-white rounded border">Chưa có đề kiểm tra nào.</p>` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${myAppState.exams.map(e => `
                <div class="bg-white p-4 rounded shadow border flex justify-between items-center">
                  <div>
                    <h3 class="font-bold text-blue-700">${e.title}</h3>
                    <p class="text-xs text-gray-500 mt-1">Thời gian: ${e.duration} phút | ${e.mcqCount || 0} TN - ${e.tfCount || 0} Đ/S - ${e.saCount || 0} Ngắn</p>
                    <div class="flex gap-3 mt-2 text-xs">
                      ${e.fileUrl ? `<a href="${e.fileUrl}" download="DeThi" class="text-blue-600 hover:underline font-semibold"><i class="fa-solid fa-file-pdf mr-1"></i>Tải đề thi</a>` : ''}
                      ${e.solutionUrl ? `<a href="${e.solutionUrl}" download="DapAnChiTiet" class="text-green-600 hover:underline font-semibold"><i class="fa-solid fa-file-lines mr-1"></i>Tải đáp án chi tiết</a>` : ''}
                      ${e.videoUrl ? `<a href="${e.videoUrl}" target="_blank" class="text-red-600 hover:underline font-semibold"><i class="fa-solid fa-video mr-1"></i>Video bài giảng</a>` : ''}
                    </div>
                  </div>
                  <button onclick="launchExam('${e.id}')" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-blue-700 shrink-0"><i class="fa-solid fa-pen-to-square mr-1"></i> Làm bài</button>
                </div>

            </div>
          `}
        `;

            <div class="flex justify-between items-center border-b pb-3">

                </div>
                <div>
                  <label class="block text-[10px] font-semibold mb-1">Số câu Đ/S</label>
                  <input type="number" id="tfCount" value="4" class="w-full p-2 border rounded text-xs">
                </div>
                <div>
                  <label class="block text-[10px] font-semibold mb-1">Số câu Ngắn</label>
                  <input type="number" id="saCount" value="2" class="w-full p-2 border rounded text-xs">
                </div>
              </div>

              <!-- 3 MỤC QUAN TRỌNG -->
              <div class="space-y-2 border p-3 rounded bg-blue-50/50">
                <span class="font-bold text-xs text-blue-900 block border-b pb-1">Tài liệu đính kèm đề kiểm tra:</span>
                <div>
                  <label class="block text-[10px] font-semibold text-gray-700">1. Up file đề thi (PDF / Ảnh)</label>
                  <input type="file" id="examFileInput" required accept="application/pdf,image/*" class="w-full p-1.5 border rounded text-xs bg-white">
                </div>
                <div>
                  <label class="block text-[10px] font-semibold text-gray-700">2. Up file đáp án chi tiết / lời giải (PDF / Ảnh)</label>
                  <input type="file" id="examSolutionInput" accept="application/pdf,image/*" class="w-full p-1.5 border rounded text-xs bg-white">
                </div>
                <div>
                  <label class="block text-[10px] font-semibold text-gray-700">3. Link video bài giảng / chữa đề (YouTube...)</label>
                  <input type="text" id="examVideoInput" placeholder="https://youtube.com/watch?v=..." class="w-full p-2 border rounded text-xs bg-white">
                </div>
              </div>

              <div class="border p-3 rounded bg-gray-50 space-y-3">
                <div class="flex justify-between items-center border-b pb-1">
                  <span class="font-bold text-xs text-gray-700">Nhập đáp án chuẩn (Phân cách các câu bằng dấu ;):</span>
                </div>
                <div>
                  <label class="block text-[10px] font-semibold text-blue-800">Đáp án Trắc nghiệm (Ví dụ: A; B; C; D; A; B)</label>
                  <input type="text" id="mcqKey" placeholder="A; B; C; D; A; B" class="w-full p-2 border rounded text-xs bg-white font-mono">
                </div>
                <div>
                  <label class="block text-[10px] font-semibold text-amber-800">Đáp án Đúng/Sai (Mỗi câu 4 ý a,b,c,d cách nhau phẩy, giữa các câu dùng dấu ;)</label>
                  <input type="text" id="tfKey" placeholder="Đ,S,Đ,S; S,Đ,Đ,S" class="w-full p-2 border rounded text-xs bg-white font-mono">
                </div>
                <div>
                  <label class="block text-[10px] font-semibold text-indigo-800">Đáp án Trả lời ngắn (Ví dụ: 3,5; -5; 1/2; 0)</label>
                  <input type="text" id="saKey" placeholder="3,5; -5; 1/2; 0" class="w-full p-2 border rounded text-xs bg-white font-mono">
                </div>
              </div>

              <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onclick="closeModal('modalExam')" class="px-3 py-1.5 border rounded">Hủy</button>
                <button type="submit" class="bg-blue-600 text-white px-4 py-1.5 rounded font-medium hover:bg-blue-700">Lưu Đề Thi</button>
              </div>
            </form>
          </div>
        </div>
      `;

      if (document.getElementById('addStuForm')) {
        document.getElementById('addStuForm').onsubmit = (e) => {
          e.preventDefault();
          const u = document.getElementById('stuUser').value;
          const p = document.getElementById('stuPass').value;
          db.ref('students').push({ username: u, password: p }, err => {
            if (!err) alert('Đã cấp tài khoản học sinh!');
          });
        };
      }

      if (document.getElementById('formAddQuestion')) {
        document.getElementById('formAddQuestion').onsubmit = (e) => {
          e.preventDefault();
          const newQ = {
            chapter: document.getElementById('qChapter').value,
            type: document.getElementById('qType').value,
            content: document.getElementById('qContent').value,
            correct: document.getElementById('qCorrect').value
          };
          db.ref('questions').push(newQ, err => {
            if (!err) {
              alert('Thêm câu hỏi vào ngân hàng thành công!');
              closeModal('modalQuestion');
            }
          });
        };
      }

      if (document.getElementById('formAddLec')) {
        document.getElementById('formAddLec').onsubmit = (e) => {
          e.preventDefault();
          const fileInput = document.getElementById('lecFileInput');
          const videoUrl = document.getElementById('lecVideoInput').value.trim();

          const processSave = (fileUrl = '', fileName = '') => {
            const newLec = {
              title: document.getElementById('lecTitle').value,
              subject: document.getElementById('lecSubject').value,
              chapter: document.getElementById('lecChapter').value,
              fileUrl: fileUrl,
              fileName: fileName,
              videoUrl: videoUrl,
              description: document.getElementById('lecDesc').value,
              instructor: 'Hai Ton',
              date: new Date().toISOString().split('T')[0]
            };
            db.ref('lectures').push(newLec, err => {
              if (!err) {
                alert('Đăng bài giảng thành công!');
                closeModal('modalLec');
              }
            });
          };

          if (fileInput.files && fileInput.files[0]) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
              processSave(uploadEvent.target.result, file.name);
            };
            reader.readAsDataURL(file);
          } else {
            processSave();
          }
        };
      }

      if (document.getElementById('formAddExam')) {
        document.getElementById('formAddExam').onsubmit = (e) => {
          e.preventDefault();
          const examFileInput = document.getElementById('examFileInput');
          const solutionInput = document.getElementById('examSolutionInput');
          const videoUrl = document.getElementById('examVideoInput').value.trim();

          if (examFileInput.files && examFileInput.files[0]) {
            const examFile = examFileInput.files[0];
            const readerExam = new FileReader();

            readerExam.onload = function(eExam) {
              const examFileUrl = eExam.target.result;
              if (solutionInput.files && solutionInput.files[0]) {
                const solFile = solutionInput.files[0];
                const readerSol = new FileReader();
                readerSol.onload = function(eSol) {
                  saveExamData(examFileUrl, eSol.target.result, videoUrl);
                };
                readerSol.readAsDataURL(solFile);
              } else {
                saveExamData(examFileUrl, '', videoUrl);
              }
            };
            readerExam.readAsDataURL(examFile);
          }
        };
      }
    }

    function saveExamData(fileUrl, solutionUrl, videoUrl) {
      const tfGroup = document.getElementById('tfKey').value.split(';').map(g => g.trim());
      let tfKeys = [];
      const tfCount = Number(document.getElementById('tfCount').value) || 0;
      for(let i = 0; i < tfCount; i++) {
        const subVals = (tfGroup[i] || '').split(',').map(s => s.trim().toUpperCase());
        tfKeys.push({
          a: subVals[0] || 'Đ',
          b: subVals[1] || 'S',
          c: subVals[2] || 'Đ',
          d: subVals[3] || 'S'
        });
      }

      const newExam = {
        title: document.getElementById('examTitle').value,
        duration: Number(document.getElementById('examDuration').value),
        fileUrl: fileUrl,
        solutionUrl: solutionUrl,
        videoUrl: videoUrl,
        mcqCount: Number(document.getElementById('mcqCount').value),
        tfCount: tfCount,
        saCount: Number(document.getElementById('saCount').value),
        mcqKey: document.getElementById('mcqKey').value,
        tfKeys: tfKeys,
        saKey: document.getElementById('saKey').value
      };

      db.ref('exams').push(newExam, err => {
        if (!err) {
          alert('Tạo đề kiểm tra và đính kèm thành công!');
          closeModal('modalExam');
        }
      });
    }

    function parseKeys(str) {
      if (!str) return [];
      if (str.includes(';')) return str.split(';').map(s => s.trim());
      return str.split(',').map(s => s.trim());
    }

    function cleanStr(val) {
      if (!val) return '';
      return val.toString().trim().replace(/\s+/g, '').replace('.', ',').toUpperCase();
    }

    function selectMCQ(qNum, val) { myAppState.userAnswers.mcq[qNum] = val; renderUI(); }
    function selectTF(qNum, subItem, val) { myAppState.userAnswers.tf[`${qNum}_${subItem}`] = val; renderUI(); }
    function inputSA(qNum, val) { myAppState.userAnswers.sa[qNum] = val.trim(); }

    function navTo(v) { 
      if (myAppState.timerRef) clearInterval(myAppState.timerRef);
      if (myAppState.tetTimerInterval) clearInterval(myAppState.tetTimerInterval);
      myAppState.view = v; 
      renderUI(); 
    }
    function pickSubject(s) { myAppState.selectedSubject = s; renderUI(); }
    function pickChapter(c) { myAppState.selectedChapter = c; renderUI(); }
    function logOut() { 
      if(myAppState.timerRef) clearInterval(myAppState.timerRef); 
      if(myAppState.tetTimerInterval) clearInterval(myAppState.tetTimerInterval);
      myAppState.currentUser = null; 
      renderUI(); 
    }
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function deleteStudent(id) { if(confirm('Xóa học sinh này?')) db.ref('students/' + id).remove(); }
    function deleteQuestion(id) { if(confirm('Xóa câu hỏi này?')) db.ref('questions/' + id).remove(); }

    function launchExam(examId) {
      const exam = myAppState.exams.find(e => e.id === examId);
      if (!exam) return;
      myAppState.activeExam = exam;
      myAppState.userAnswers = { mcq: {}, tf: {}, sa: {} };
      myAppState.timeRemaining = (exam.duration || 45) * 60;
      myAppState.resultObj = null;
      myAppState.view = 'do_exam';
      renderUI();

      if (myAppState.timerRef) clearInterval(myAppState.timerRef);
      myAppState.timerRef = setInterval(() => {
        if (myAppState.timeRemaining > 0 && !myAppState.resultObj) {
          myAppState.timeRemaining--;
          const clockEl = document.querySelector('.bg-red-500');
          if (clockEl) {
            const mm = Math.floor(myAppState.timeRemaining / 60);
            const ss = myAppState.timeRemaining % 60;
            clockEl.innerHTML = `<i class="fa-solid fa-clock mr-1"></i> ${mm}:${ss.toString().padStart(2, '0')}`;
          }
        } else if (myAppState.timeRemaining === 0 && !myAppState.resultObj) {
          clearInterval(myAppState.timerRef);
          finishExam();
        }
      }, 1000);
    }

    function finishExam() {
      if (myAppState.timerRef) clearInterval(myAppState.timerRef);
      if (!myAppState.activeExam) return;

      const exam = myAppState.activeExam;
      let totalCorrect = 0;
      let totalItems = (exam.mcqCount || 0) + ((exam.tfCount || 0) * 4) + (exam.saCount || 0);

      const mcqKeys = parseKeys(exam.mcqKey);
      for (let i = 1; i <= exam.mcqCount; i++) {
        if (myAppState.userAnswers.mcq[i] && cleanStr(myAppState.userAnswers.mcq[i]) === cleanStr(mcqKeys[i-1])) totalCorrect++;
      }

      for (let i = 1; i <= (exam.tfCount || 0); i++) {
        ['a', 'b', 'c', 'd'].forEach(sub => {
          const uVal = myAppState.userAnswers.tf[`${i}_${sub}`];
          const cVal = exam.tfKeys?.[i-1]?.[sub];
          if (uVal && cleanStr(uVal) === cleanStr(cVal)) totalCorrect++;
        });
      }

      const saKeys = parseKeys(exam.saKey);
      for (let i = 1; i <= exam.saCount; i++) {
        if (myAppState.userAnswers.sa[i] && cleanStr(myAppState.userAnswers.sa[i]) === cleanStr(saKeys[i-1])) totalCorrect++;
      }

      const finalScore = totalItems > 0 ? Number(((totalCorrect / totalItems) * 10).toFixed(1)) : 10;

      let aiComment = "";
      let aiWish = "";
      if (finalScore >= 9) {
        aiComment = "Tuyệt vời! Kiến thức của bạn rất vững chắc, tư duy logic nhạy bén và xử lý các dạng bài rất chính xác. Hãy tiếp tục giữ vững phong độ đỉnh cao này nhé!";
        aiWish = "Chúc bạn luôn giữ mãi ngọn lửa đam mê học tập và gặt hái thật nhiều thành tích rực rỡ trong các kỳ thi sắp tới!";
      } else if (finalScore >= 7) {
        aiComment = "Kết quả rất tốt! Bạn đã nắm vững phần lớn kiến thức trọng tâm. Tuy nhiên, hãy chú ý rà soát lại một số câu còn nhầm lẫn để đạt điểm tuyệt đối ở lần sau.";
        aiWish = "Chúc bạn ngày càng tiến bộ, tự tin vững vàng và luôn tràn đầy năng lượng trên con đường chinh phục tri thức!";
      } else if (finalScore >= 5) {
        aiComment = "Đạt yêu cầu cơ bản! Bạn đã hiểu bài ở mức độ nền tảng, tuy nhiên cần luyện tập thêm nhiều dạng bài tập nâng cao và cẩn thận hơn trong các bước tính toán.";
        aiWish = "Chúc bạn luôn kiên trì, nỗ lực hết mình và đạt kết quả cao hơn nữa trong những bài kiểm tra tiếp theo!";
      } else {
        aiComment = "Cần cố gắng nhiều hơn nữa nhé! Bạn hãy ôn tập lại thật kỹ lý thuyết sách giáo khoa, làm lại các bài tập ví dụ và nhờ thầy cô hoặc trợ giảng AI hỗ trợ ngay những phần chưa hiểu rõ.";
        aiWish = "Chúc bạn luôn giữ vững tinh thần lạc quan, quyết tâm lội ngược dòng thành công trong các kỳ thi quan trọng!";
      }

      const subData = {
        examTitle: exam.title,
        studentName: myAppState.currentUser.username,
        score: finalScore,
        date: new Date().toLocaleString()
      };

      db.ref('submissions').push(subData);
      myAppState.resultObj = { finalScore, correctCount: totalCorrect, totalQuestions: totalItems, aiComment, aiWish };
      renderUI();
    }

    function toggleAIChat() {
      const widget = document.getElementById('aiChatWidget');
      const toggleBtn = document.getElementById('aiChatToggleBtn');
      if (widget.classList.contains('hidden')) {
        widget.classList.remove('hidden');
        toggleBtn.classList.add('hidden');
      } else {
        widget.classList.add('hidden');
        toggleBtn.classList.remove('hidden');
      }
    }

    async function sendAIMessage() {
      const input = document.getElementById('aiChatInput');
      const msgContainer = document.getElementById('aiChatMessages');
      const text = input.value.trim();
      if (!text) return;

      msgContainer.innerHTML += `
        <div class="flex justify-end">
          <div class="bg-blue-600 text-white p-2.5 rounded-xl max-w-[85%]">${text}</div>
        </div>
      `;
      input.value = '';
      msgContainer.scrollTop = msgContainer.scrollHeight;

      const loadingId = 'loading_' + Date.now();
      msgContainer.innerHTML += `
        <div id="${loadingId}" class="flex justify-start">
          <div class="bg-blue-50 text-blue-900 p-2.5 rounded-xl border border-blue-100 max-w-[85%] flex items-center gap-2">
            <i class="fa-solid fa-spinner animate-spin"></i> Trợ giảng AI đang suy nghĩ...
          </div>
        </div>
      `;
      msgContainer.scrollTop = msgContainer.scrollHeight;

      try {
        const response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=YOUR_GEMINI_API_KEY", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: "Bạn là trợ giảng môn Toán. Hãy hướng dẫn câu hỏi: " + text }] }] })
        });
        const data = await response.json();
        document.getElementById(loadingId).remove();
        let aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Mình đã nhận được câu hỏi. Bạn hãy kiểm tra lại các bước tính toán nhé!";
        msgContainer.innerHTML += `<div class="flex justify-start"><div class="bg-blue-50 text-blue-900 p-2.5 rounded-xl border border-blue-100 max-w-[85%] whitespace-pre-wrap">${aiReply}</div></div>`;
      } catch (err) {
        document.getElementById(loadingId).remove();
        msgContainer.innerHTML += `<div class="flex justify-start"><div class="bg-red-50 text-red-700 p-2.5 rounded-xl border border-red-100 max-w-[85%]">Lỗi kết nối AI.</div></div>`;
      }
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    bootApp();
  </script>
</body>
</html>
