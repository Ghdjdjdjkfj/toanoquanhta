<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Bài Giảng Trực Tuyến</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    // CẤU HÌNH FIREBASE CỦA BẠN
    const firebaseConfig = {
      apiKey: "AIzaSyD73a7Wr2d2_u4FeSfigcZ2pfrL6ai-3iQ",
      authDomain: "webtoan9.firebaseapp.com",
      databaseURL: "https://webtoan9-default-rtdb.firebaseio.com",
      projectId: "webtoan9",
      storageBucket: "webtoan9.firebasestorage.app",
      messagingSenderId: "688386595335",
      appId: "1:688386595335:web:c77441d012b1dba56be8a2",
      measurementId: "G-NH4MZXP235"
    };

    // Khởi tạo Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const { useState, useEffect } = React;

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const savedUser = localStorage.getItem('current_user_cloud');
        return savedUser ? JSON.parse(savedUser) : null;
      });

      const [loginTab, setLoginTab] = useState('login');
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [authError, setAuthError] = useState('');

      const [lectures, setLectures] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedLecture, setSelectedLecture] = useState(null);
      const [showModal, setShowModal] = useState(false);
      const [view, setView] = useState('home');

      // Form đăng bài mới (Admin)
      const [formData, setFormData] = useState({
        title: '',
        subject: 'Toán 9',
        instructor: '',
        videoUrl: '',
        fileName: 'De_thi_Toan9.pdf',
        fileSize: '3.5 MB',
        fileUrl: '',
        description: ''
      });

      // Đọc dữ liệu bài giảng thời gian thực từ đám mây Firebase
      useEffect(() => {
        const lecturesRef = db.ref('lectures');
        lecturesRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            const list = Object.keys(data).map(key => ({
              id: key,
              ...data[key]
            })).reverse();
            setLectures(list);
            if (!selectedLecture && list.length > 0) {
              setSelectedLecture(list[0]);
            }
          } else {
            setLectures([]);
          }
          setLoading(false);
        });

        return () => lecturesRef.off();
      }, []);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('current_user_cloud', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('current_user_cloud');
        }
      }, [currentUser]);

      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError('');
        
        if (loginForm.username === 'admin' && loginForm.password === 'admin123') {
          setCurrentUser({ username: 'Quản trị viên (Admin)', role: 'admin' });
          return;
        }
        if (loginForm.username === 'hocsinh' && loginForm.password === 'hs123') {
          setCurrentUser({ username: 'Học sinh', role: 'student' });
          return;
        }

        const savedAccounts = JSON.parse(localStorage.getItem('registered_accounts_cloud') || '[]');
        const found = savedAccounts.find(acc => acc.username === loginForm.username && acc.password === loginForm.password);
        
        if (found) {
          setCurrentUser({ username: found.username, role: found.role });
        } else {
          setAuthError('Tên đăng nhập hoặc mật khẩu không chính xác!');
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        setAuthError('');
        if (!loginForm.username || !loginForm.password) {
          setAuthError('Vui lòng điền đầy đủ thông tin!');
          return;
        }

        const savedAccounts = JSON.parse(localStorage.getItem('registered_accounts_cloud') || '[]');
        if (savedAccounts.some(acc => acc.username === loginForm.username) || loginForm.username === 'admin') {
          setAuthError('Tên tài khoản này đã tồn tại!');
          return;
        }

        const newAcc = { username: loginForm.username, password: loginForm.password, role: 'student' };
        savedAccounts.push(newAcc);
        localStorage.setItem('registered_accounts_cloud', JSON.stringify(savedAccounts));
        
        alert('Đăng ký thành công! Hãy đăng nhập để học.');
        setLoginTab('login');
      };

      const handleLogout = () => {
        setCurrentUser(null);
      };

      const handleAddLecture = (e) => {
        e.preventDefault();
        
        const newLectureData = {
          title: formData.title,
          subject: formData.subject,
          instructor: formData.instructor || "Giáo viên",
          date: new Date().toISOString().split('T')[0],
          videoUrl: formData.videoUrl || "https://www.w3schools.com/html/mov_bbb.mp4",
          description: formData.description,
          files: formData.fileUrl ? [
            {
              name: formData.fileName || "Tai_lieu.pdf",
              size: formData.fileSize || "3.5 MB",
              url: formData.fileUrl
            }
          ] : []
        };

        db.ref('lectures').push(newLectureData, (error) => {
          if (error) {
            alert("Lỗi đăng bài: " + error.message);
          } else {
            alert("Đã đăng bài giảng công khai thành công! Tất cả học sinh đã có thể nhìn thấy.");
            setShowModal(false);
            setFormData({ title: '', subject: 'Toán 9', instructor: '', videoUrl: '', fileName: 'De_thi_Toan9.pdf', fileSize: '3.5 MB', fileUrl: '', description: '' });
          }
        });
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-600 to-indigo-800 flex items-center justify-center p-4">
            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
              <div className="text-center mb-6">
                <i className="fa-solid fa-graduation-cap text-blue-600 text-4xl mb-2"></i>
                <h1 className="text-2xl font-bold text-gray-800">Cổng Học Tập Bài Giảng</h1>
                <p className="text-sm text-gray-500 mt-1">Dữ liệu kết nối Đám Mây Trực Tuyến</p>
              </div>

              <div className="flex border-b mb-6">
                <button onClick={() => { setLoginTab('login'); setAuthError(''); }} className={`flex-1 pb-2 font-semibold text-sm ${loginTab === 'login' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-400'}`}>Đăng Nhập</button>
                <button onClick={() => { setLoginTab('register'); setAuthError(''); }} className={`flex-1 pb-2 font-semibold text-sm ${loginTab === 'register' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-400'}`}>Đăng Ký Học Sinh</button>
              </div>

              {authError && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-xs mb-4 border border-red-200">{authError}</div>}

              {loginTab === 'login' ? (
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Tên đăng nhập</label>
                    <input type="text" required placeholder="admin hoặc hocsinh" className="w-full p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Mật khẩu</label>
                    <input type="password" required placeholder="••••••••" className="w-full p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                  </div>
                  <div className="bg-blue-50 p-3 rounded-lg text-xs text-blue-800 space-y-1">
                    <p className="font-bold">Tài khoản mẫu:</p>
                    <p>👨‍💻 Admin: <code className="bg-white px-1 rounded">admin</code> / Mật khẩu: <code className="bg-white px-1 rounded">admin123</code></p>
                    <p>🧑‍🎓 Học sinh: <code className="bg-white px-1 rounded">hocsinh</code> / Mật khẩu: <code className="bg-white px-1 rounded">hs123</code></p>
                  </div>
                  <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow">Đăng Nhập Ngay</button>
                </form>
              ) : (
                <form onSubmit={handleRegister} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Tên tài khoản học sinh</label>
                    <input type="text" required placeholder="Nhập tên đăng nhập..." className="w-full p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Mật khẩu</label>
                    <input type="password" required placeholder="••••••••" className="w-full p-3 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} />
                  </div>
                  <button type="submit" className="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition shadow">Tạo Tài Khoản Học Sinh</button>
                </form>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-blue-600 text-white shadow-md py-3 px-6 flex justify-between items-center sticky top-0 z-40">
            <div onClick={() => setView('home')} className="flex items-center space-x-3 cursor-pointer hover:opacity-90">
              <i className="fa-solid fa-graduation-cap text-2xl"></i>
              <span className="text-xl font-bold tracking-wide">Trang Chủ Bài Giảng</span>
            </div>

            <div className="flex items-center space-x-3">
              <button onClick={() => setView('home')} className={`px-3 py-1.5 rounded-lg text-sm font-medium ${view === 'home' ? 'bg-blue-800' : 'hover:bg-blue-500'}`}>
                <i className="fa-solid fa-house mr-1"></i> Trang chủ
              </button>

              {currentUser.role === 'admin' && (
                <button onClick={() => setShowModal(true)} className="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium shadow flex items-center">
                  <i className="fa-solid fa-cloud-arrow-up mr-1.5"></i> Đăng Bài Mới (Lên Đám Mây)
                </button>
              )}

              <div className="flex items-center space-x-2 bg-blue-700 px-3 py-1.5 rounded-lg text-sm">
                <i className="fa-solid fa-user-shield"></i>
                <span className="font-medium">{currentUser.username}</span>
                <button onClick={handleLogout} title="Đăng xuất" className="ml-2 text-red-200 hover:text-white">
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
              </div>
            </div>
          </header>

          <div className="max-w-6xl w-full mx-auto p-4 md:p-6 flex-1">
            {view === 'home' ? (
              <div>
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-bold text-gray-800 flex items-center">
                    <i className="fa-solid fa-book-open text-blue-600 mr-2"></i> Danh Sách Bài Giảng
                  </h2>
                  <span className="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-semibold">
                    Xin chào: {currentUser.username}
                  </span>
                </div>

                {loading ? (
                  <div className="text-center py-12 text-gray-500">
                    <i className="fa-solid fa-spinner fa-spin text-3xl text-blue-600 mb-2"></i>
                    <p>Đang tải danh sách bài giảng từ Đám Mây Cloud...</p>
                  </div>
                ) : lectures.length === 0 ? (
                  <div className="bg-white p-8 text-center rounded-xl border text-gray-500">
                    Chưa có bài giảng nào được đăng. Admin hãy bấm "Đăng Bài Mới" để tạo bài học đầu tiên!
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {lectures.map(item => (
                      <div key={item.id} className="bg-white rounded-xl shadow border hover:shadow-lg transition flex flex-col justify-between p-5">
                        <div>
                          <span className="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded font-semibold">{item.subject}</span>
                          <h3 className="font-bold text-lg text-gray-900 mt-2 line-clamp-2">{item.title}</h3>
                          <p className="text-xs text-gray-500 mt-1"><i className="fa-regular fa-calendar"></i> {item.date}</p>
                          <p className="text-sm text-gray-600 mt-3 line-clamp-2">{item.description}</p>
                        </div>

                        <div className="mt-5 border-t pt-3 flex items-center justify-between">
                          <button onClick={() => { setSelectedLecture(item); setView('detail'); }} className="bg-blue-600 text-white px-3 py-1.5 rounded text-sm hover:bg-blue-700 font-medium">
                            <i className="fa-solid fa-circle-play mr-1"></i> Học ngay
                          </button>
                          <span className="text-xs text-gray-500"><i className="fa-solid fa-paperclip mr-1"></i> {item.files ? item.files.length : 0} tài liệu</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-white rounded-xl shadow-md p-6">
                <button onClick={() => setView('home')} className="mb-4 text-blue-600 hover:underline flex items-center text-sm font-medium">
                  <i className="fa-solid fa-arrow-left mr-1"></i> Quay lại Trang Chủ
                </button>

                <h1 className="text-2xl font-bold text-gray-900 mb-2">{selectedLecture.title}</h1>
                <div className="flex items-center space-x-4 text-sm text-gray-500 mb-4">
                  <span>Môn: <b>{selectedLecture.subject}</b></span>
                  <span>Giảng viên: <b>{selectedLecture.instructor}</b></span>
                </div>

                <div className="bg-black aspect-video rounded-lg overflow-hidden mb-6">
                  <video controls className="w-full h-full">
                    <source src={selectedLecture.videoUrl} type="video/mp4" />
                    Trình duyệt không hỗ trợ phát video.
                  </video>
                </div>

                <div className="bg-gray-50 p-4 rounded-lg border mb-6">
                  <h3 className="font-bold text-gray-800 mb-1">Mô tả bài học:</h3>
                  <p className="text-gray-700 text-sm leading-relaxed">{selectedLecture.description}</p>
                </div>

                <div className="border-t pt-4">
                  <h3 className="font-bold text-gray-800 mb-3 flex items-center">
                    <i className="fa-solid fa-folder-open text-blue-600 mr-2"></i> Tài liệu & Bài tập đính kèm:
                  </h3>
                  {selectedLecture.files && selectedLecture.files.length > 0 ? (
                    <div className="space-y-3">
                      {selectedLecture.files.map((file, idx) => (
                        <div key={idx} className="flex items-center justify-between bg-gray-50 hover:bg-gray-100 p-4 rounded-xl border border-gray-200 transition shadow-sm">
                          <div className="flex items-center space-x-3">
                            <i className="fa-solid fa-file-pdf text-red-500 text-3xl"></i>
                            <div>
                              <p className="font-semibold text-gray-900 text-sm">{file.name}</p>
                              <p className="text-xs text-gray-500 mt-0.5">{file.size}</p>
                            </div>
                          </div>
                          <a href={file.url} target="_blank" rel="noopener noreferrer" download={file.name} className="text-indigo-600 hover:text-indigo-800 font-medium text-sm flex items-center space-x-1.5 bg-white px-3.5 py-2 rounded-lg border border-gray-200 shadow-sm">
                            <i className="fa-solid fa-download"></i>
                            <span>Tải xuống</span>
                          </a>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p className="text-sm text-gray-500 italic">Không có tài liệu đính kèm cho bài học này.</p>
                  )}
                </div>
              </div>
            )}
          </div>

          {showModal && currentUser.role === 'admin' && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-lg w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
                <h3 className="text-lg font-bold mb-4 text-gray-800">Đăng Bài Giảng Mới Lên Cloud</h3>
                <form onSubmit={handleAddLecture} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Tiêu đề bài học</label>
                    <input required type="text" className="w-full p-2 border rounded text-sm" value={formData.title} onChange={e=>setFormData({...formData, title: e.target.value})} />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Môn học</label>
                      <input type="text" className="w-full p-2 border rounded text-sm" value={formData.subject} onChange={e=>setFormData({...formData, subject: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Giảng viên</label>
                      <input type="text" className="w-full p-2 border rounded text-sm" value={formData.instructor} onChange={e=>setFormData({...formData, instructor: e.target.value})} />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Link Video MP4 (URL)</label>
                    <input type="url" placeholder="https://..." className="w-full p-2 border rounded text-sm" value={formData.videoUrl} onChange={e=>setFormData({...formData, videoUrl: e.target.value})} />
                  </div>

                  <div className="bg-blue-50 p-3 rounded-lg border border-blue-200 space-y-2">
                    <label className="block text-xs font-bold text-blue-800">▶ File bài tập đính kèm (Để học sinh tải):</label>
                    <div>
                      <label className="block text-[11px] text-gray-600">Tên file hiển thị:</label>
                      <input type="text" placeholder="De_thi_Toan9.pdf" className="w-full p-1.5 border rounded text-xs bg-white" value={formData.fileName} onChange={e=>setFormData({...formData, fileName: e.target.value})} />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] text-gray-600">Dung lượng:</label>
                        <input type="text" placeholder="3.5 MB" className="w-full p-1.5 border rounded text-xs bg-white" value={formData.fileSize} onChange={e=>setFormData({...formData, fileSize: e.target.value})} />
                      </div>
                      <div>
                        <label className="block text-[11px] text-gray-600">Link tải file (Google Drive URL):</label>
                        <input type="text" placeholder="https://..." className="w-full p-1.5 border rounded text-xs bg-white" value={formData.fileUrl} onChange={e=>setFormData({...formData, fileUrl: e.target.value})} />
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Mô tả bài học</label>
                    <textarea rows="2" className="w-full p-2 border rounded text-sm" value={formData.description} onChange={e=>setFormData({...formData, description: e.target.value})}></textarea>
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={()=>setShowModal(false)} className="px-3 py-1.5 border rounded text-sm text-gray-600">Hủy</button>
                    <button type="submit" className="px-4 py-1.5 bg-blue-600 text-white rounded text-sm font-medium">Đăng Bài Công Khai</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
