  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD73a7Wr2d2_u4FeSfigcZ2pfrL6ai-3iQ",
      authDomain: "webtoan9.firebaseapp.com",
      databaseURL: "https://webtoan9-default-rtdb.firebaseio.com",
      projectId: "webtoan9",
      storageBucket: "webtoan9.firebasestorage.app",
      messagingSenderId: "688386595335",
      appId: "1:688386595335:web:c77441d012b1dba56be8a2",
      measurementId: "G-NH4MZXP235"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const chaptersListToan9 = [
      'Tất cả',
      'Chương I: Phương trình và hệ phương trình bậc nhất hai ẩn',
      'Chương II: Phương trình và bất phương trình bậc nhất một ẩn',
      'Chương III: Căn bậc hai và căn bậc ba',
      'Chương IV: Hệ thức lượng trong tam giác vuông',
      'Chương V: Đường tròn',
      'Chương VI: Hàm số y=ax² (a≠0) và phương trình bậc hai một ẩn',
      'Chương VII: Tần số và tần số tương đối',
      'Chương VIII: Xác suất của biến cố trong một số mô hình xác suất đơn giản',
      'Chương IX: Đường tròn ngoại tiếp và đường tròn nội tiếp',
      'Chương X: Một số hình khối trong thực tiễn',
      'Giữa kỳ I', 'Cuối kỳ I', 'Giữa kỳ II', 'Cuối kỳ II',
      'Trắc nghiệm', 'Bài tập tự luyện', 'Chủ đề ôn thi vào 10', 'Đề chính thức Sở GD-ĐT Gia Lai'
    ];

    let myAppState = {
      currentUser: null,
      view: 'home',
      selectedSubject: 'Toán 9',
      selectedChapter: 'Tất cả',
      lectures: [],
      exams: [],
      students: [],
      submissions: [],
      activeExam: null,
      userAnswers: { mcq: {}, tf: {}, sa: {} },
      timeRemaining: 0,
      resultObj: null,
      timerRef: null,
      tetTimerInterval: null
    };

    function bootApp() {
      db.ref('lectures').on('value', snap => {
        const d = snap.val();
        myAppState.lectures = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('exams').on('value', snap => {
        const d = snap.val();
        myAppState.exams = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('students').on('value', snap => {
        const d = snap.val();
        myAppState.students = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : [];
        renderUI();
      });
      db.ref('submissions').on('value', snap => {
        const d = snap.val();
        myAppState.submissions = d ? Object.keys(d).map(k => ({ id: k, ...d[k] })).reverse() : [];
        renderUI();
      });
    }

    const tetWishes = [
      "Chúc năm mới vạn sự như ý, tỷ sự như mơ, làm việc như thơ, đời vui như nhạc!",
      "Năm mới phát tài phát lộc, gia đình hạnh phúc, an khang thịnh vượng!",
      "Chúc bạn học tập chăm chỉ, thi đâu đậu đấy, điểm số cao vút như diều gặp gió!",
      "Sang năm mới chúc mọi dự định đều thành hiện thực, luôn tràn đầy năng lượng tích cực!",
      "Cung chúc tân niên một chữ nhàn, chúc mừng gia quyến đặng bình an!",
      "Chúc nhà nhà hòa thuận, người người hạnh phúc, tài lộc đầy nhà, xuân sang đắc lộc!",
      "Năm mới gặt hái thật nhiều thành công mới, vượt mọi thử thách, chạm tay đến ước mơ!"
    ];

    function getDailyTetWish() {
      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
      return tetWishes[dayOfYear % tetWishes.length];
    }

    function getNextHoliday() {
      const now = new Date();
      const currentYear = now.getFullYear();

      const holidays = [
        { name: "Ngày Nhà giáo Việt Nam (20/11)", month: 11, day: 20 },
        { name: "Tết Dương Lịch (01/01)", month: 1, day: 1 },
        { name: "Ngày Giải phóng Miền Nam (30/04)", month: 4, day: 30 },
        { name: "Ngày Quốc tế Lao động (01/05)", month: 5, day: 1 },
        { name: "Ngày Quốc khánh (02/09)", month: 9, day: 2 },
        { name: "Ngày Phụ nữ Việt Nam (20/10)", month: 10, day: 20 }
      ];

      let upcoming = null;
      let minDiff = Infinity;

      holidays.forEach(h => {
        let hDate = new Date(currentYear, h.month - 1, h.day);
        if (hDate < now) {
          hDate = new Date(currentYear + 1, h.month - 1, h.day);
        }
        const diff = hDate - now;
        if (diff < minDiff) {
          minDiff = diff;
          upcoming = { name: h.name, date: hDate, diffDays: Math.ceil(diff / (1000 * 60 * 60 * 24)) };
        }
      });

      return upcoming;
    }

    function startTetCountdown() {
      if (myAppState.tetTimerInterval) clearInterval(myAppState.tetTimerInterval);
      
      const tet2027Date = new Date('2027-02-06T00:00:00');

      function updateTimer() {
        const now = new Date();
        const diff = tet2027Date - now;

        const boxesEl = document.getElementById('tetCountdownBoxes');
        const holidayEl = document.getElementById('holidayCountdownDisplay');
        if (!boxesEl) return;

        if (diff <= 0 && diff > -86400000 * 3) {
          boxesEl.innerHTML = `<div class="text-yellow-300 font-bold text-lg animate-bounce py-2">🧧 CHÚC MỪNG NĂM MỚI 2027 (ĐINH MÙI)! Vạn sự như ý!</div>`;
        } else {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          boxesEl.innerHTML = `
            <div class="flex items-center gap-2 sm:gap-3 my-1">
              <div class="flex flex-col items-center">
                <div class="bg-black/40 border border-yellow-400/40 text-yellow-300 font-black text-lg sm:text-2xl px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl shadow-md min-w-[48px] sm:min-w-[60px] text-center font-mono">
                  ${String(days).padStart(2, '0')}
                </div>
                <span class="text-[9px] sm:text-[10px] text-yellow-200 uppercase mt-1 font-bold tracking-wider">Ngày</span>
              </div>
              <span class="text-yellow-300 font-bold text-lg sm:text-xl pb-4">:</span>
              <div class="flex flex-col items-center">
                <div class="bg-black/40 border border-yellow-400/40 text-yellow-300 font-black text-lg sm:text-2xl px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl shadow-md min-w-[48px] sm:min-w-[60px] text-center font-mono">
                  ${String(hours).padStart(2, '0')}
                </div>
                <span class="text-[9px] sm:text-[10px] text-yellow-200 uppercase mt-1 font-bold tracking-wider">Giờ</span>
              </div>
              <span class="text-yellow-300 font-bold text-lg sm:text-xl pb-4">:</span>
              <div class="flex flex-col items-center">
                <div class="bg-black/40 border border-yellow-400/40 text-yellow-300 font-black text-lg sm:text-2xl px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl shadow-md min-w-[48px] sm:min-w-[60px] text-center font-mono">
                  ${String(minutes).padStart(2, '0')}
                </div>
                <span class="text-[9px] sm:text-[10px] text-yellow-200 uppercase mt-1 font-bold tracking-wider">Phút</span>
              </div>
              <span class="text-yellow-300 font-bold text-lg sm:text-xl pb-4">:</span>
              <div class="flex flex-col items-center">
                <div class="bg-black/40 border border-yellow-400/40 text-yellow-300 font-black text-lg sm:text-2xl px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-xl shadow-md min-w-[48px] sm:min-w-[60px] text-center font-mono">
                  ${String(seconds).padStart(2, '0')}
                </div>
                <span class="text-[9px] sm:text-[10px] text-yellow-200 uppercase mt-1 font-bold tracking-wider">Giây</span>
              </div>
            </div>
          `;
        }

        if (holidayEl) {
          const nextH = getNextHoliday();
          if (nextH) {
            holidayEl.innerHTML = `🎉 Sự kiện tiếp theo: <b class="text-amber-200">${nextH.name}</b> - còn <b class="text-yellow-300 font-bold">${nextH.diffDays} ngày</b>!`;
          }
        }
      }

      updateTimer();
      myAppState.tetTimerInterval = setInterval(updateTimer, 1000);
    }

    function renderUI() {
      const rootDiv = document.getElementById('app');
      
      if (!myAppState.currentUser) {
        rootDiv.innerHTML = `
          <div class="min-h-screen bg-blue-600 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8">
              <h1 class="text-2xl font-bold text-center mb-1 text-gray-800">Tài Liệu Ôn Tập THCS & THPT</h1>
              <p class="text-center text-sm text-gray-500 mb-6">Hệ thống thi online chuẩn mới</p>
              <form id="loginForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold mb-1">Tên đăng nhập</label>
                  <input type="text" id="username" required class="w-full p-3 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-xs font-semibold mb-1">Mật khẩu</label>
                  <input type="password" id="password" required class="w-full p-3 border rounded text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700">Đăng Nhập</button>
              </form>
            </div>
          </div>
        `;
        document.getElementById('loginForm').onsubmit = (e) => {
          e.preventDefault();
          const u = document.getElementById('username').value;
          const p = document.getElementById('password').value;
          if (u === 'admin' && p === 'admin123') {
            myAppState.currentUser = { username: 'Admin', role: 'admin' };
          } else {
            const found = myAppState.students.find(s => s.username === u && s.password === p);
            if (found) myAppState.currentUser = { username: found.username, role: 'student' };
            else alert('Tài khoản hoặc mật khẩu không chính xác!');
          }
          renderUI();
        };
        return;
      }

      let navButtons = `
        <button onclick="navTo('home')" class="hover:underline font-semibold">Thư mục</button>
        <button onclick="navTo('exam_list')" class="hover:underline font-semibold">Kiểm tra</button>
      `;
      if (myAppState.currentUser.role === 'admin') {
        navButtons += `
          <button onclick="navTo('statistics')" class="hover:underline font-semibold">Thống kê</button>
          <button onclick="navTo('admin_panel')" class="hover:underline font-semibold">Quản lý HS</button>
        `;
      }

      let mainArea = '';

      if (myAppState.view === 'home') {
        const subjects = ['Toán 9', 'Toán 8', 'Toán 7', 'Đại số 10', 'Hình học 11', 'Ôn thi vào 10'];
        const filteredLectures = myAppState.lectures.filter(l => {
          const mSub = myAppState.selectedSubject === 'Tất cả' || l.subject === myAppState.selectedSubject;
          const mChap = myAppState.selectedChapter === 'Tất cả' || l.chapter === myAppState.selectedChapter;
          return mSub && mChap;
        });

        mainArea = `
          <div id="tetBannerContent" class="bg-gradient-to-r from-red-600 via-rose-600 to-amber-600 text-white p-4 sm:p-5 rounded-2xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 border border-red-400">
            <div class="space-y-2 text-center md:text-left flex-1">
              <div class="text-[11px] uppercase tracking-widest text-yellow-200 font-bold flex items-center justify-center md:justify-start gap-1">
                <i class="fa-solid fa-seedling"></i> Chào xuân Đinh Mùi 2027
              </div>
              <div id="tetCountdownBoxes" class="flex justify-center md:justify-start"></div>
              <div id="holidayCountdownDisplay" class="text-xs text-yellow-100 font-medium">Đang tính sự kiện tiếp theo...</div>
              <div class="text-xs text-red-100 italic pt-1 border-t border-red-400/50"><i class="fa-solid fa-quote-left mr-1"></i> ${getDailyTetWish()}</div>
            </div>
            <div class="bg-black/30 p-3 sm:p-4 rounded-2xl text-center border border-white/20 shrink-0 shadow-inner">
              <span class="text-[10px] uppercase block text-yellow-300 font-bold tracking-wider">Mùng 1 Tết 2027</span>
              <span class="text-base sm:text-lg font-black text-white">06/02/2027</span>
            </div>
          </div>

          <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
            <div class="flex gap-2 overflow-x-auto pb-2">
              ${subjects.map(s => `<button onclick="pickSubject('${s}')" class="px-3 py-1.5 rounded text-sm font-medium ${myAppState.selectedSubject === s ? 'bg-blue-600 text-white' : 'bg-white border'}">${s}</button>`).join('')}
            </div>
            ${myAppState.currentUser.role === 'admin' ? `<button onclick="openModal('modalLec')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-green-700">+ Đăng Bài Giảng</button>` : ''}
          </div>

          <div class="bg-white p-3 rounded border mb-6 space-y-2">
            <span class="font-bold text-xs text-blue-700 uppercase tracking-wide block border-b pb-1"><i class="fa-solid fa-list-ul mr-1"></i> Danh mục bài học (${myAppState.selectedSubject}):</span>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${chaptersListToan9.map(c => `<button onclick="pickChapter('${c.replace(/'/g, "\\'")}')" class="px-2.5 py-1 rounded text-xs font-medium transition ${myAppState.selectedChapter === c ? 'bg-indigo-600 text-white shadow' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}">${c}</button>`).join('')}
            </div>
          </div>

          ${filteredLectures.length === 0 ? `<p class="text-center text-gray-500 py-10 bg-white rounded border">Chưa có bài giảng nào trong mục này.</p>` : `
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${filteredLectures.map(l => `
                <div class="bg-white p-4 rounded shadow border flex flex-col justify-between">
                  <div>
                    <span class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">${l.subject || 'Toán 9'}</span>
                    <p class="text-[11px] text-indigo-600 font-semibold mt-1 truncate">${l.chapter || ''}</p>
                    <h3 class="font-bold text-base mt-1">${l.title}</h3>
                    <p class="text-xs text-gray-500 mt-1">GV: ${l.instructor || 'Hai Ton'}</p>
                    <p class="text-xs text-gray-600 mt-2 line-clamp-2">${l.description || ''}</p>
                  </div>
                  <div class="mt-4 flex gap-2">
                    ${l.fileUrl ? `<a href="${l.fileUrl}" download="${l.fileName || 'TaiLieu'}" class="flex-1 bg-blue-600 text-white py-1.5 rounded text-xs font-semibold text-center hover:bg-blue-700"><i class="fa-solid fa-download mr-1"></i> Tải tài liệu</a>` : ''}
                    ${l.videoUrl ? `<a href="${l.videoUrl}" target="_blank" class="bg-red-600 text-white px-3 py-1.5 rounded text-xs font-semibold text-center hover:bg-red-700" title="Xem video bài giảng"><i class="fa-solid fa-play"></i></a>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        `;
        setTimeout(startTetCountdown, 50);
      }

      else if (myAppState.view === 'exam_list') {
        mainArea = `
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Danh Sách Đề Kiểm Tra Online</h2>
            ${myAppState.currentUser.role === 'admin' ? `<button onclick="openModal('modalExam')" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-green-700">+ Tạo Đề Thi Mới</button>` : ''}
          </div>
          ${myAppState.exams.length === 0 ? `<p class="text-gray-500 text-center py
