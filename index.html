<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài Liệu Ôn Tập THCS & THPT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>
  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyD73a7Wr2d2_u4FeSfigcZ2pfrL6ai-3iQ",
      authDomain: "webtoan9.firebaseapp.com",
      databaseURL: "https://webtoan9-default-rtdb.firebaseio.com",
      projectId: "webtoan9",
      storageBucket: "webtoan9.firebasestorage.app",
      messagingSenderId: "688386595335",
      appId: "1:688386595335:web:c77441d012b1dba56be8a2",
      measurementId: "G-NH4MZXP235"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const { useState, useEffect } = React;

    function App() {
      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('user_v9') || 'null'));
      const [view, setView] = useState('home');
      const [lectures, setLectures] = useState([]);
      const [exams, setExams] = useState([]);
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });

      useEffect(() => {
        db.ref('lectures').on('value', snap => {
          const d = snap.val();
          setLectures(d ? Object.keys(d).map(k => ({ id: k, ...d[k] })).reverse() : []);
        });
        db.ref('exams').on('value', snap => {
          const d = snap.val();
          setExams(d ? Object.keys(d).map(k => ({ id: k, ...d[k] })).reverse() : []);
        });
      }, []);

      useEffect(() => {
        localStorage.setItem('user_v9', JSON.stringify(user));
      }, [user]);

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginForm.username === 'admin' && loginForm.password === 'admin123') {
          setUser({ username: 'Admin', role: 'admin' });
        } else {
          alert('Sai tài khoản hoặc mật khẩu!');
        }
      };

      if (!user) {
        return (
          <div className="min-h-screen bg-blue-600 flex items-center justify-center p-4">
            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
              <h1 className="text-2xl font-bold text-center mb-2">Tài Liệu Ôn Tập THCS & THPT</h1>
              <p className="text-center text-gray-500 text-sm mb-6">Facebook: Hai Ton</p>
              <form onSubmit={handleLogin} className="space-y-4">
                <input type="text" placeholder="Tên đăng nhập" required className="w-full p-3 border rounded-lg" value={loginForm.username} onChange={e=>setLoginForm({...loginForm, username: e.target.value})} />
                <input type="password" placeholder="Mật khẩu" required className="w-full p-3 border rounded-lg" value={loginForm.password} onChange={e=>setLoginForm({...loginForm, password: e.target.value})} />
                <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">Đăng Nhập</button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-blue-600 text-white p-4 flex justify-between items-center shadow">
            <h1 className="font-bold text-lg">Tài Liệu Ôn Tập THCS & THPT</h1>
            <div className="space-x-4 flex items-center">
              <button onClick={()=>setView('home')} className="hover:underline">Trang chủ</button>
              <button onClick={()=>setView('exams')} className="hover:underline">Kiểm tra</button>
              <span className="bg-blue-700 px-3 py-1 rounded">Xin chào: {user.username}</span>
              <button onClick={()=>setUser(null)} className="text-red-200"><i className="fa-solid fa-right-from-bracket"></i></button>
            </div>
          </header>
          <main className="max-w-4xl w-full mx-auto p-6 flex-1">
            {view === 'home' ? (
              <div>
                <h2 className="text-xl font-bold mb-4">Danh sách bài giảng ({lectures.length})</h2>
                {lectures.length === 0 ? <p className="text-gray-500">Chưa có bài giảng nào trên hệ thống.</p> : (
                  <div className="space-y-3">
                    {lectures.map(l => (
                      <div key={l.id} className="bg-white p-4 rounded-lg shadow border">
                        <h3 className="font-bold text-lg">{l.title}</h3>
                        <p className="text-sm text-gray-600">{l.description}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <div>
                <h2 className="text-xl font-bold mb-4">Danh sách bài kiểm tra ({exams.length})</h2>
                {exams.length === 0 ? <p className="text-gray-500">Chưa có bài kiểm tra nào.</p> : null}
              </div>
            )}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
