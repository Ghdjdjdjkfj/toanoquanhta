<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài Liệu Ôn Tập THCS & THPT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyD73a7Wr2d2_u4FeSfigcZ2pfrL6ai-3iQ",
      authDomain: "webtoan9.firebaseapp.com",
      databaseURL: "https://webtoan9-default-rtdb.firebaseio.com",
      projectId: "webtoan9",
      storageBucket: "webtoan9.firebasestorage.app",
      messagingSenderId: "688386595335",
      appId: "1:688386595335:web:c77441d012b1dba56be8a2",
      measurementId: "G-NH4MZXP235"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const { useState, useEffect } = React;

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');

      const [lectures, setLectures] = useState([]);
      const [exams, setExams] = useState([]);
      const [students, setStudents] = useState([]);
      const [submissions, setSubmissions] = useState([]);

      const [view, setView] = useState('home');
      const [selectedSubject, setSelectedSubject] = useState('Toán 9');
      const [selectedChapter, setSelectedChapter] = useState('Tất cả');
      const [selectedLecture, setSelectedLecture] = useState(null);
      const [selectedExam, setSelectedExam] = useState(null);

      const [showModalLec, setShowModalLec] = useState(false);
      const [showModalExam, setShowModalExam] = useState(false);

      const [lecForm, setLecForm] = useState({
        title: '', subject: 'Toán 9', chapter: 'Chương I', instructor: 'Hai Ton', videoUrl: '', fileName: 'Tai_lieu.pdf', fileUrl: '', description: ''
      });

      const [examForm, setExamForm] = useState({
        title: '', duration: 15, questions: [{ questionText: '', options: ['', '', '', ''], correctAnswer: 0 }]
      });
      const [latexInput, setLatexInput] = useState('');

      const [stuUser, setStuUser] = useState('');
      const [stuPass, setStuPass] = useState('');
      const [userAnswers, setUserAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(0);
      const [examResult, setExamResult] = useState(null);

      useEffect(() => {
        db.ref('lectures').on('value', snap => {
          const d = snap.val();
          setLectures(d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : []);
        });
        db.ref('exams').on('value', snap => {
          const d = snap.val();
          setExams(d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : []);
        });
        db.ref('students').on('value', snap => {
          const d = snap.val();
          setStudents(d ? Object.keys(d).map(k => ({ id: k, ...d[k] })) : []);
        });
        db.ref('submissions').on('value', snap => {
          const d = snap.val();
          setSubmissions(d ? Object.keys(d).map(k => ({ id: k, ...d[k] })).reverse() : []);
        });
      }, []);

      useEffect(() => {
        let timer;
        if (view === 'do_exam' && timeLeft > 0 && !examResult) {
          timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (view === 'do_exam' && timeLeft === 0 && !examResult) {
          handleSubmitExam();
        }
        return () => clearInterval(timer);
      }, [view, timeLeft, examResult]);

      const handleLogin = (e) => {
        e.preventDefault();
        setAuthError('');
        if (username === 'admin' && password === 'admin123') {
          setCurrentUser({ username: 'Admin', role: 'admin' });
          return;
        }
        const found = students.find(s => s.username === username && s.password === password);
        if (found) {
          setCurrentUser({ username: found.username, role: 'student' });
        } else {
          setAuthError('Sai tài khoản hoặc mật khẩu!');
        }
      };

      const handleAddStudent = (e) => {
        e.preventDefault();
        if (!stuUser || !stuPass) return;
        db.ref('students').push({ username: stuUser, password: stuPass }, err => {
          if (!err) {
            alert('Đã cấp tài khoản học sinh thành công!');
            setStuUser(''); setStuPass('');
          }
        });
      };

      const handleDeleteStudent = (id) => {
        if (confirm('Xóa tài khoản này?')) db.ref('students/' + id).remove();
      };

      const handleAddLecture = (e) => {
        e.preventDefault();
        db.ref('lectures').push({
          ...lecForm,
          date: new Date().toISOString().split('T')[0],
          videoUrl: lecForm.videoUrl || "https://www.w3schools.com/html/mov_bbb.mp4",
          files: lecForm.fileUrl ? [{ name: lecForm.fileName, size: '3.5 MB', url: lecForm.fileUrl }] : []
        }, err => {
          if (!err) {
            alert('Đăng bài giảng thành công!');
            setShowModalLec(false);
          }
        });
      };

      const handleParseLatex = () => {
        if (!latexInput.trim()) return alert('Vui lòng dán mã LaTeX!');
        try {
          const rawBlocks = latexInput.split(/\\begin\{ex\}/i).filter(b => b.trim().length > 0);
          const parsed = [];
          rawBlocks.forEach(b => {
            let parts = b.split(/\\choice/i);
            let qText = parts[0].replace(/\\end\{ex\}/g, '').replace(/^(Câu\s*\d+[\.:]?)/i, '').trim();
            let options = ['Đáp án A', 'Đáp án B', 'Đáp án C', 'Đáp án D'];
            if (parts.length > 1) {
              let matches = parts[1].match(/\{([^}]*)\}/g);
              if (matches && matches.length >= 4) {
                for (let i = 0; i < 4; i++) options[i] = matches[i].replace(/^\{|\}$/g, '').trim();
              }
            }
            if (qText) parsed.push({ questionText: qText, options, correctAnswer: 0 });
          });
          if (parsed.length > 0) {
            setExamForm(prev => ({ ...prev, questions: parsed }));
            alert(`Đã bóc tách thành công ${parsed.length} câu hỏi!`);
          } else {
            alert('Không tìm thấy cấu trúc \begin{ex} hợp lệ.');
          }
        } catch (e) {
          alert('Lỗi phân tích: ' + e.message);
        }
      };

      const handleAddExam = (e) => {
        e.preventDefault();
        db.ref('exams').push(examForm, err => {
          if (!err) {
            alert('Tạo đề kiểm tra thành công!');
            setShowModalExam(false);
            setExamForm({ title: '', duration: 15, questions: [{ questionText: '', options: ['', '', '', ''], correctAnswer: 0 }] });
            setLatexInput('');
          }
        });
      };

      const startExam = (exam) => {
        setSelectedExam(exam);
        setUserAnswers({});
        setTimeLeft(exam.duration * 60);
        setExamResult(null);
        setView('do_exam');
      };

      const handleSubmitExam = () => {
        if (!selectedExam) return;
        let score = 0;
        selectedExam.questions.forEach((q, idx) => {
          if (userAnswers[idx] === q.correctAnswer) score++;
        });
        const finalScore = Number(((score / selectedExam.questions.length) * 10).toFixed(1));
        db.ref('submissions').push({
          examTitle: selectedExam.title,
          studentName: currentUser.username,
          score: finalScore,
          correctCount: score,
          totalQuestions: selectedExam.questions.length,
          date: new Date().toLocaleString()
        });
        setExamResult({ score, total: selectedExam.questions.length, finalScore });
      };

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-blue-600 flex items-center justify-center p-4">
            <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-8">
              <h1 className="text-2xl font-bold text-center mb-1 text-gray-800">Tài Liệu Ôn Tập THCS & THPT</h1>
              <p className="text-center text-sm text-gray-500 mb-6">Facebook: Hai Ton</p>
              {authError && <div className="bg-red-50 text-red-600 p-3 rounded text-xs mb-4">{authError}</div>}
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold mb-1">Tên đăng nhập</label>
                  <input type="text" required className="w-full p-3 border rounded text-sm" value={username} onChange={e => setUsername(e.target.value)} />
                </div>
                <div>
                  <label className="block text-xs font-semibold mb-1">Mật khẩu</label>
                  <input type="password" required className="w-full p-3 border rounded text-sm" value={password} onChange={e => setPassword(e.target.value)} />
                </div>
                <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700">Đăng Nhập</button>
              </form>
            </div>
          </div>
        );
      }

      const chaptersList = ['Tất cả', 'Chương I', 'Chương II', 'Chương III', 'Chương IV', 'Chương V'];
      const subjectsList = ['Toán 9', 'Toán 8', 'Toán 7', 'Đại số 10', 'Hình học 11', 'Ôn thi vào 10'];

      const filteredLectures = lectures.filter(l => {
        const mSub = selectedSubject === 'Tất cả' || l.subject === selectedSubject;
        const mChap = selectedChapter === 'Tất cả' || l.chapter === selectedChapter;
        return mSub && mChap;
      });

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-blue-600 text-white p-4 flex justify-between items-center shadow sticky top-0 z-40">
            <div onClick={() => setView('home')} className="font-bold text-lg cursor-pointer flex items-center gap-2">
              <i className="fa-solid fa-graduation-cap"></i> Tài Liệu Ôn Tập THCS & THPT
            </div>
            <div className="flex items-center gap-4 text-sm font-medium">
              <button onClick={() => setView('home')} className="hover:underline">Thư mục</button>
              <button onClick={() => setView('exam_list')} className="hover:underline">Kiểm tra</button>
              {currentUser.role === 'admin' && (
                <>
                  <button onClick={() => setView('statistics')} className="hover:underline">Thống kê</button>
                  <button onClick={() => setView('admin_panel')} className="hover:underline">Quản lý HS</button>
                </>
              )}
              <span className="bg-blue-700 px-3 py-1 rounded">{currentUser.username}</span>
              <button onClick={() => setCurrentUser(null)} className="text-red-200"><i className="fa-solid fa-right-from-bracket"></i></button>
            </div>
          </header>

          <main className="max-w-6xl w-full mx-auto p-6 flex-1">
            {view === 'home' && (
              <div>
                <div className="flex flex-wrap justify-between items-center mb-4 gap-2">
                  <div className="flex gap-2 overflow-x-auto pb-2">
                    {['Tất cả', ...subjectsList].map(sub => (
                      <button key={sub} onClick={() => setSelectedSubject(sub)} className={`px-3 py-1.5 rounded text-sm font-medium ${selectedSubject === sub ? 'bg-blue-600 text-white' : 'bg-white border'}`}>{sub}</button>
                    ))}
                  </div>
                  {currentUser.role === 'admin' && (
                    <button onClick={() => setShowModalLec(true)} className="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold">+ Đăng Bài Giảng</button>
                  )}
                </div>

                <div className="bg-white p-3 rounded border mb-6 flex gap-2 overflow-x-auto items-center text-xs">
                  <span className="font-bold text-gray-500">Chương:</span>
                  {chaptersList.map(c => (
                    <button key={c} onClick={() => setSelectedChapter(c)} className={`px-3 py-1 rounded ${selectedChapter === c ? 'bg-indigo-600 text-white' : 'bg-gray-100'}`}>{c}</button>
                  ))}
                </div>

                {filteredLectures.length === 0 ? (
                  <p className="text-center text-gray-500 py-10">Chưa có bài giảng nào.</p>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {filteredLectures.map(l => (
                      <div key={l.id} className="bg-white p-4 rounded shadow border flex flex-col justify-between">
                        <div>
                          <span className="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold">{l.subject} - {l.chapter}</span>
                          <h3 className="font-bold text-base mt-2">{l.title}</h3>
                          <p className="text-xs text-gray-500 mt-1">GV: {l.instructor}</p>
                          <p className="text-xs text-gray-600 mt-2 line-clamp-2">{l.description}</p>
                        </div>
                        <button onClick={() => { setSelectedLecture(l); setView('detail'); }} className="mt-4 bg-blue-600 text-white py-1.5 rounded text-xs font-semibold">Vào học</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {view === 'detail' && selectedLecture && (
              <div className="bg-white p-6 rounded shadow">
                <button onClick={() => setView('home')} className="text-blue-600 text-sm mb-4 block"><i className="fa-solid fa-arrow-left"></i> Quay lại</button>
                <h2 className="text-2xl font-bold mb-2">{selectedLecture.title}</h2>
                <div className="bg-black aspect-video rounded overflow-hidden mb-4">
                  <video controls className="w-full h-full"><source src={selectedLecture.videoUrl} type="video/mp4" /></video>
                </div>
                <p className="text-gray-700 mb-4">{selectedLecture.description}</p>
                {selectedLecture.files?.map((f, i) => (
                  <div key={i} className="flex justify-between items-center bg-gray-50 p-3 rounded border">
                    <span>{f.name}</span>
                    <a href={f.url} target="_blank" className="bg-blue-600 text-white px-3 py-1 rounded text-xs">Tải xuống</a>
                  </div>
                ))}
              </div>
            )}

            {view === 'exam_list' && (
              <div>
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold">Danh Sách Đề Kiểm Tra</h2>
                  {currentUser.role === 'admin' && (
                    <button onClick={() => setShowModalExam(true)} className="bg-green-600 text-white px-4 py-2 rounded text-sm font-semibold">+ Tạo Đề Từ LaTeX</button>
                  )}
                </div>
                {exams.length === 0 ? <p className="text-gray-500">Chưa có bài kiểm tra nào.</p> : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {exams.map(e => (
                      <div key={e.id} className="bg-white p-4 rounded shadow border flex justify-between items-center">
                        <div>
                          <h3 className="font-bold">{e.title}</h3>
                          <p className="text-xs text-gray-500 mt-1">Thời gian: {e.duration} phút | {e.questions.length} câu</p>
                        </div>
                        <button onClick={() => startExam(e)} className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-semibold">Làm bài</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {view === 'do_exam' && selectedExam && (
              <div className="bg-white p-6 rounded shadow max-w-2xl mx-auto">
                <div className="flex justify-between items-center border-b pb-3 mb-4 sticky top-14 bg-white">
                  <h2 className="font-bold text-lg">{selectedExam.title}</h2>
                  <div className="bg-red-100 text-red-700 font-bold px-3 py-1 rounded text-sm">
                    {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                  </div>
                </div>

                {examResult ? (
                  <div className="text-center py-6">
                    <div className="text-4xl font-bold text-blue-600 mb-2">{examResult.finalScore} điểm</div>
                    <p className="text-sm text-gray-600 mb-4">Đúng {examResult.score}/{examResult.total} câu.</p>
                    <button onClick={() => setView('exam_list')} className="bg-blue-600 text-white px-6 py-2 rounded text-sm">Quay lại</button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {selectedExam.questions.map((q, qIdx) => (
                      <div key={qIdx} className="bg-gray-50 p-4 rounded border">
                        <p className="font-semibold text-sm mb-2">Câu {qIdx + 1}: {q.questionText}</p>
                        <div className="space-y-1.5">
                          {q.options.map((opt, optIdx) => (
                            <label key={optIdx} className={`flex items-center gap-2 p-2 rounded border cursor-pointer text-sm ${userAnswers[qIdx] === optIdx ? 'bg-blue-50 border-blue-400' : 'bg-white'}`}>
                              <input type="radio" name={`q_${qIdx}`} checked={userAnswers[qIdx] === optIdx} onChange={() => setUserAnswers({...userAnswers, [qIdx]: optIdx})} />
                              <span><b>{['A','B','C','D'][optIdx]}.</b> {opt}</span>
                            </label>
                          ))}
                        </div>
                      </div>
                    ))}
                    <button onClick={handleSubmitExam} className="w-full bg-green-600 text-white py-3 rounded font-bold">Nộp Bài</button>
                  </div>
                )}
              </div>
            )}

            {view === 'statistics' && currentUser.role === 'admin' && (
              <div className="bg-white p-6 rounded shadow">
                <h2 className="text-xl font-bold mb-4">Thống Kê Điểm Số</h2>
                {submissions.length === 0 ? <p className="text-gray-500">Chưa có bài nộp.</p> : (
                  <table className="w-full text-left text-sm border-collapse">
                    <thead><tr className="bg-gray-100 border-b"><th className="p-2">Học sinh</th><th className="p-2">Bài thi</th><th className="p-2">Điểm</th><th className="p-2">Thời gian</th></tr></thead>
                    <tbody>
                      {submissions.map(s => (
                        <tr key={s.id} className="border-b"><td className="p-2 font-semibold">{s.studentName}</td><td className="p-2">{s.examTitle}</td><td className="p-2 font-bold text-blue-600">{s.score}</td><td className="p-2 text-xs text-gray-500">{s.date}</td></tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            )}

            {view === 'admin_panel' && currentUser.role === 'admin' && (
              <div className="bg-white p-6 rounded shadow">
                <h2 className="text-xl font-bold mb-4">Quản Lý Học Sinh</h2>
                <form onSubmit={handleAddStudent} className="flex gap-2 mb-6">
                  <input type="text" placeholder="Tên đăng nhập" required className="p-2 border rounded text-sm flex-1" value={stuUser} onChange={e => setStuUser(e.target.value)} />
                  <input type="text" placeholder="Mật khẩu" required className="p-2 border rounded text-sm flex-1" value={stuPass} onChange={e => setStuPass(e.target.value)} />
                  <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded text-sm font-semibold">Cấp TK</button>
                </form>
                <table className="w-full text-left text-sm border-collapse">
                  <thead><tr className="bg-gray-100 border-b"><th className="p-2">Tên đăng nhập</th><th className="p-2">Mật khẩu</th><th className="p-2 text-right">Xóa</th></tr></thead>
                  <tbody>
                    {students.map(s => (
                      <tr key={s.id} className="border-b"><td className="p-2 font-semibold">{s.username}</td><td className="p-2">{s.password}</td><td className="p-2 text-right"><button onClick={() => handleDeleteStudent(s.id)} className="text-red-600 text-xs">Xóa</button></td></tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>

          {showModalLec && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded p-6 max-w-md w-full space-y-3 shadow-xl">
                <h3 className="font-bold text-lg">Đăng Bài Giảng</h3>
                <form onSubmit={handleAddLecture} className="space-y-3 text-sm">
                  <div>
                    <label className="block text-xs font-semibold mb-1">Tên bài học</label>
                    <input type="text" placeholder="VD: Bài 1: Phương trình..." required className="w-full p-2 border rounded" value={lecForm.title} onChange={e => setLecForm({...lecForm, title: e.target.value})} />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold mb-1">Môn học</label>
                      <select className="w-full p-2 border rounded bg-white" value={lecForm.subject} onChange={e => setLecForm({...lecForm, subject: e.target.value})}>
                        {subjectsList.map(x => <option key={x} value={x}>{x}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1">Chương</label>
                      <select className="w-full p-2 border rounded bg-white" value={lecForm.chapter} onChange={e => setLecForm({...lecForm, chapter: e.target.value})}>
                        {chaptersList.filter(c => c !== 'Tất cả').map(x => <option key={x} value={x}>{x}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Link Video MP4</label>
                    <input type="url" placeholder="https://..." className="w-full p-2 border rounded" value={lecForm.videoUrl} onChange={e => setLecForm({...lecForm, videoUrl: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Link file PDF/Word</label>
                    <input type="text" placeholder="https://..." className="w-full p-2 border rounded" value={lecForm.fileUrl} onChange={e => setLecForm({...lecForm, fileUrl: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Mô tả</label>
                    <textarea placeholder="Mô tả ngắn..." className="w-full p-2 border rounded" rows="2" value={lecForm.description} onChange={e => setLecForm({...lecForm, description: e.target.value})}></textarea>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowModalLec(false)} className="px-3 py-1.5 border rounded">Hủy</button>
                    <button type="submit" className="bg-blue-600 text-white px-4 py-1.5 rounded">Đăng Bài</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showModalExam && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded p-6 max-w-xl w-full space-y-3 shadow-xl">
                <h3 className="font-bold text-lg">Tạo Đề Từ LaTeX</h3>
                <form onSubmit={handleAddExam} className="space-y-3 text-sm">
                  <div>
                    <label className="block text-xs font-semibold mb-1">Tiêu đề bài kiểm tra</label>
                    <input type="text" placeholder="VD: Kiểm tra 15 phút Chương 1" required className="w-full p-2 border rounded" value={examForm.title} onChange={e => setExamForm({...examForm, title: e.target.value})} />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1">Thời gian làm bài (phút)</label>
                    <input type="number" required className="w-full p-2 border rounded" value={examForm.duration} onChange={e => setExamForm({...examForm, duration: Number(e.target.value)})} />
                  </div>
                  <div className="bg-yellow-50 p-3 rounded border border-yellow-200">
                    <label className="block text-xs font-bold text-yellow-800 mb-1">Dán mã LaTeX (\begin{ex} ... \choice{A}{B}{C}{D}):</label>
                    <textarea rows="4" className="w-full p-2 border rounded text-xs font-mono bg-white" value={latexInput} onChange={e => setLatexInput(e.target.value)} placeholder="\begin{ex}&#10;Câu hỏi...&#10;\choice{$A$}{$B$}{$C$}{$D$}&#10;\end{ex}"></textarea>
                    <button type="button" onClick={handleParseLatex} className="mt-2 bg-yellow-600 text-white px-3 py-1 rounded text-xs font-semibold">Bóc tách câu hỏi</button>
                  </div>
                  <p className="text-xs text-gray-500 font-semibold">Đã nhận diện: <b>{examForm.questions.length}</b> câu hỏi sẵn sàng.</p>
                  <div className="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onClick={() => setShowModalExam(false)} className="px-3 py-1.5 border rounded">Hủy</button>
                    <button type="submit" className="bg-blue-600 text-white px-4 py-1.5 rounded">Lưu Đề Thi</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
